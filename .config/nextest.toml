# cargo-nextest settings for the Rust workspace.
#
# The gate (`tools/rust-engine-program/run-rust-checks.mjs`) runs
# `cargo nextest run` without `--profile`, so `default` is the profile every
# gate test step uses.

[profile.default]
# Bound every test, so a slow or hung test FAILS the gate loudly instead of
# stalling it (#809) or quietly doubling its test step. A test still running
# at period x terminate-after = 6 minutes reports TIMEOUT and fails the run,
# which makes the gate's `test --workspace` row FAIL. Checked with a 1s period
# on a 4.5s test: TERMINATING at 1.000s, TIMEOUT at 1.073s, nextest exit 100.
#
# MEASURED (win32/x64, jobs 8, test-threads 8, scratch in %TEMP%): in 74 gate
# runs from Oct 1 to Oct 11 the step's execution phase had a median of 14.8
# minutes, set by three large-history tests at 496s to 660s. Those three now
# take 37s to 58s run together. In full collab and runtime suite runs the
# slowest test is `admitted_baselines_commit_atomically_and_replay_after_reopen`:
# 37s alone and 85s to 122s beside the rest of its suite. On Oct 13 a gate run
# on a loaded host timed out two capacity tests at 3 minutes that took 48s to
# 63s in another gate run that day. 6 minutes is 3x the worst ordinary run.
#
# A test that legitimately needs longer gets its own override here, with its
# measured time. Make it faster first.
#
# `period` keeps nextest's default of 60s, so the SLOW warnings the gate log
# already prints stay as they are.
slow-timeout = { period = "60s", terminate-after = 6 }
# A failing test runs once more, including one stopped at the timeout above, so
# a hung test fails after two timeouts, 12 minutes. A test that passes only on
# that retry reports FLAKY and does not fail the gate; the verifier records it
# in result.json, and it is a defect to fix. A test that fails twice fails.
retries = 1

# Keep the latency fixture isolated from other tests in this runner.
[[profile.default.overrides]]
filter = 'test(two_thousand_members_bound_store_work_and_ydoc_wait)'
threads-required = "num-test-threads"

# Run the WAL-pressure held-proof test alone: it grows the WAL past the write limit, and other tests slow the checkpoints it waits for (#2960).
[[profile.default.overrides]]
filter = 'binary_id(=dohc-engine-runtime::owner_publication) & test(=held_proof::a_proof_gives_way_when_the_wal_presses_and_writes_keep_succeeding)'
threads-required = "num-test-threads"
