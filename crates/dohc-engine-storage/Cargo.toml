[package]
name = "dohc-engine-storage"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "CAL-1/CAL-2 calibration slice: one writable rusqlite connection per workspace, the day-one v2 engine schema (migration + request/idempotency ledgers + versioning tables), the compound transactional write API, and the v1-vs-v2 fingerprint fence. Dormant; not wired into the product."

[features]
# The crash-injection seam. OFF by default so a release build that links this
# crate WITHOUT the feature dead-code-eliminates every fault poll on the write
# lane (provably zero overhead). Enabled by `dohc-engine-testkit` for the
# in-process crash tier and by `cargo test --workspace` via feature unification.
fault-injection = []

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
