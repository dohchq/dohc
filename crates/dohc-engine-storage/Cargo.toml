[package]
license.workspace = true
name = "dohc-engine-storage"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "SQLite storage for the workspace engine: one writable connection per workspace, the engine schema and migrations, and the transactional write seam."

[features]
# The crash-injection seam. OFF by default so a release build that links this
# crate WITHOUT the feature dead-code-eliminates every fault poll on the write
# lane (provably zero overhead). Enabled by `dohc-engine-testkit` for the
# in-process crash tier and by `cargo test --workspace` via feature unification.
fault-injection = []

[dependencies]
# `hooks` for the progress handler that counts a store open's work.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
sha2 = "0.11"
thiserror = "2"
# Robust manifest parsing for the backup validator (the producer hand-writes a
# flat JSON manifest; the validator must read it back to enforce the
# no-manifest / checksum-mismatch invariants). serde_json parses without a
# derive dependency via `Value`.
serde_json = "1"
# Safe wrapper over the platform free-space call (statvfs / GetDiskFreeSpaceEx)
# so the backup preflight keeps forbid(unsafe_code). Only the real
# `FreeSpaceProbe` uses it; the disk-full behavior is tested through an injected
# probe, not by filling a disk.
fs4 = "1"

[dev-dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
