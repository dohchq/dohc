[package]
name = "dohc-macos-files"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Safe wrappers that copy a file's macOS ACL and extended attributes, and flush behind a drive barrier."

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }

# Only the ACL copy and checks, the save-intent check and the barrier flush
# may call macOS FFI.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
