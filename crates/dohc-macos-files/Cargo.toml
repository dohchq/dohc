[package]
name = "dohc-macos-files"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Safe wrappers that create a file without its folder's inherited ACL, keep a folder private to its owner, name a folder by its ID, copy a file's macOS ACL and extended attributes, flush behind a drive barrier, keep a folder out of iCloud Drive, and unlink a file no process has open."

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }

# Only the uninherited create, the private folder, the ACL copy, the
# save-intent check and the barrier flush may call macOS FFI.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
