[package]
name = "dohc-engine-files"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "CAL-3 calibration slice: workspace filesystem scan / streaming content hash / scan-generation diff / reconcile-plan, with cooperative cancellation BETWEEN bounded units and fully bounded resources (max files, max file size, bounded read buffer, bounded hash-worker pool, bounded in-memory diff), the path floor, and the watcher dirty-generation reconcile model — driven actor-native on a dedicated blocking thread under a tokio command loop (the CAL-2 model). Dormant; not wired into the product."

[features]
# The materialization crash-injection seam. OFF by default so a release build
# dead-code-eliminates every fault poll on the file-write lane; enabled by
# `dohc-engine-testkit` (feature unification arms it for `cargo test
# --workspace`). Delegates to the storage seam so there is one fault registry.
fault-injection = ["dohc-engine-storage/fault-injection"]

[dependencies]
# The durable job ledger + blob store the materialization pipeline consumes.
# `dohc-engine-files` owns the FILESYSTEM side of the crash boundary; the DB
# side (job rows, blobs) lives in storage, which this depends on.
dohc-engine-storage = { path = "../dohc-engine-storage" }
# Streaming content hashing — same crate/version the storage slice content-
# addresses with, so a scan hash and a stored blob hash are byte-identical.
sha2 = "0.10"
thiserror = "2"
# The actor command loop. The blocking scan/hash work stays on ONE dedicated
# OS thread (never the async runtime); commands flow over tokio::sync channels
# and the worker receives them via `blocking_recv` — the CAL-2 actor model.
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
# Cooperative cancellation tree (PORTING.md §12): checked BETWEEN bounded
# units (per-file / per-batch), never inside a hash of a single file's stream.
tokio-util = "0.7"
# Native workspace notifications. The watcher owns `RecommendedWatcher` on a
# dedicated thread and reduces every settled burst to the actor's sticky dirty
# signal; no notify callback ever runs the scan or actor command loop.
notify = "8"
# OS file identity ((st_dev, st_ino) / (volume serial, file index)) for the
# watcher root-liveness check: existence alone can't distinguish the ORIGINAL
# watched directory object from a delete-then-recreate that leaves the OS watch
# pointing at a dead inode. Already in the tree via `notify`; same safe API the
# runtime's EngineDbIdentity uses, so this crate keeps forbid(unsafe_code).
file-id = "0.2"

[target.'cfg(unix)'.dependencies]
# Safe descriptor-relative filesystem operations. On Linux this also exposes
# openat2; other Unix targets use the portable openat/renameat path.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
# The differential harness parses the shared workspace-kernel golden fixtures
# (independently-computed hashes) and the crate's extended goldens.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Drives the async FilesActor traces (cancellation + deadline through the tokio
# loop). Also recomputes expected hashes via a second code path (non-tautology).
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
dohc-engine-testkit = { path = "../dohc-engine-testkit" }

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
