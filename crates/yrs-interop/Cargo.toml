# yrs/Yjs interoperability regression harness. This crate is a stdio JSON
# harness that the Node driver (scripts/) talks to.
#
# PINNED INTEROP PAIR (audited together; a lone upgrade of either side can
# silently reopen interop divergence):
#   yjs 13.6.30  (pnpm-lock.yaml)  <->  yrs 0.27.3 (below)
[package]
license.workspace = true
name = "dohc-yrs-interop"
version.workspace = true
# edition/rust-version stay pinned to this crate's yrs 0.27.3 baseline
# (not inherited from the workspace, which centralizes edition 2024 members).
edition = "2021"
rust-version = "1.82"
publish.workspace = true

[dependencies]
yrs = "=0.27.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
# Supersedes this crate's former crate-local `unsafe_code = "forbid"`.
[lints]
workspace = true
