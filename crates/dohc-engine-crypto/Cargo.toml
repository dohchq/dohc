[package]
name = "dohc-engine-crypto"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "R08 secrets crypto core: AES-256-GCM secret-file AEAD with byte-exact cross-engine parity to the TS engine, the scrypt-wrapped workspace data-key envelope, and redaction-safe zeroizing plaintext/key types. Pure crypto — no storage or filesystem. Dormant; not wired into the product."

[features]
# Exposes the deterministic, caller-supplied-IV `seal_with_iv`. OFF by default:
# a fixed 96-bit nonce reused under one key is CATASTROPHIC for AES-GCM (leaks
# the GHASH auth key and the XOR of plaintexts), so production consumers must
# only reach `seal`, which draws a fresh CSPRNG nonce. Deterministic sealing is
# needed solely by parity fixtures/tests; enable this feature there.
test-util = []

[dependencies]
# AES-256-GCM AEAD. RustCrypto's `aes-gcm` is the chosen primitive over `ring`
# because (a) it is pure Rust, so this crate's `#![forbid(unsafe_code)]` holds
# for our code while the audited unsafe stays inside the dependency, (b) it
# exposes a DETACHED-tag API (`encrypt_in_place_detached`) that matches the TS
# storage shape where the 12-byte IV and 16-byte tag live in their own columns
# separate from the ciphertext, and (c) it shares the RustCrypto stack already
# vendored via `sha2`. Parameters (256-bit key, 96-bit nonce, 128-bit tag) are
# identical to Node's `aes-256-gcm`, which the cross-engine fixtures prove.
aes-gcm = "0.11"
# scrypt KDF for the passphrase-wrapped data-key envelope (N=2^17, r=8, p=1),
# byte-matching Node's `crypto.scrypt` in `secretKeyEnvelope.ts`.
scrypt = { version = "0.12", default-features = false }
# CSPRNG for random IVs and fresh data keys (safe wrapper; keeps forbid-unsafe).
getrandom = "0.4"
# Best-effort in-memory scrubbing of plaintext/key material on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
# Envelope JSON (parsed/emitted in the exact TS field order for parity).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW | O_NONBLOCK for the key file's swap-proof, unblockable open.
libc = "0.2"

[dev-dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }
# Base64 alphabet checks in tests only; production base64 is hand-rolled in
# `base64.rs` to reproduce Node Buffer's forgiving-decode semantics exactly.
base64 = "0.23"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
