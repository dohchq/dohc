[package]
license.workspace = true
name = "dohc-engine-crypto"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Secret-file crypto for the workspace engine: AES-256-GCM AEAD and zeroizing plaintext and key types."

[dependencies]
# AES-256-GCM AEAD. RustCrypto's `aes-gcm` is the chosen primitive over `ring`
# because (a) it is pure Rust, so this crate's `#![forbid(unsafe_code)]` holds
# for our code while the audited unsafe stays inside the dependency, (b) it
# exposes a DETACHED-tag API (`encrypt_inout_detached`) that matches the TS
# storage shape where the 12-byte IV and 16-byte tag live in their own columns
# separate from the ciphertext, and (c) it shares the RustCrypto stack already
# vendored via `sha2`. Parameters (256-bit key, 96-bit nonce, 128-bit tag) are
# identical to Node's `aes-256-gcm`, which the cross-engine fixtures prove.
aes-gcm = "0.11"
# CSPRNG for random IVs and fresh data keys (safe wrapper; keeps forbid-unsafe).
getrandom = "0.4"
# Best-effort in-memory scrubbing of plaintext/key material on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW | O_NONBLOCK for the key file's swap-proof, unblockable open.
libc = "0.2"

[dev-dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }
# Base64 alphabet checks in tests only; production base64 is hand-rolled in
# `base64.rs` to reproduce Node Buffer's forgiving-decode semantics exactly.
base64 = "0.23"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
