[package]
name = "dohc-engine-protocol"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Wire types, error taxonomy, bounds, framed codec, and transport seams for the workspace engine protocol."

[features]
default = ["supervisor"]
# Tokio-based bounded request dispatch skeleton (replaces thread-per-request).
supervisor = ["dep:tokio"]
# TypeScript/JSON Schema binding generation (build tooling, not production).
bindings = ["dep:schemars", "dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
], optional = true }

[dev-dependencies]
# test-util enables start_paused deterministic-time supervisor tests.
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "test-util",
] }

[[example]]
name = "generate_bindings"
required-features = ["bindings"]

[[example]]
name = "update_fixtures"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
