[package]
name = "dohc-engine-domain"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "CAL-2 calibration slice: the versioning domain — stable object identity, versioned text write/read, moment history with keyset pagination, named-version fork, and restore (set-active-version) — over the CAL-1 storage core's single-transaction seam. Dormant; not wired into the product."

[features]
# Forwards the storage crash-injection seam so the version-create / restore
# crash tests can arm the named fault points.
fault-injection = ["dohc-engine-storage/fault-injection"]

[dependencies]
dohc-engine-storage = { path = "../dohc-engine-storage" }
# R08 secrets crypto: AES-256-GCM secret-file AEAD + redaction-safe plaintext /
# key types. The secret domain store encrypts on write and decrypts only in the
# single authorized materialization accessor; ciphertext-only reaches storage.
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
# R07's cross-platform security classifier is the single path floor shared by
# plaintext and secret-backed stores. Direction is domain -> files only; the
# files crate remains independent of domain.
dohc-engine-files = { path = "../dohc-engine-files" }
# The domain composes its versioning SQL against the transaction/connection the
# storage core hands it; it owns the version/moment semantics, storage owns the
# connection, open ritual, txn boundary, and fault seam.
rusqlite = { version = "0.37", features = ["bundled"] }
# Content-addressed text blobs (sha256), matching the storage core's discipline.
sha2 = "0.10"
thiserror = "2"
# R09 chats: NFC identity normalization for channel/projection/heading fields
# (matrix 4.1b) and base64url feed cursors (matrix 4.8, byte-parity with the TS
# `Buffer.from(..., "base64url")` encode/decode).
unicode-normalization = "0.1"
base64 = "0.22"
# Feed-cursor payloads are JSON arrays `[createdAtMs, messageId]`, byte-parity
# with the TS `JSON.stringify` cursor body.
serde_json = "1"

[dev-dependencies]
# Scratch workspaces + the crash harness for the domain's durability traces.
# Depending on the testkit here also unifies the storage `fault-injection`
# feature ON for `cargo test`, arming the version-create / restore fault points.
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
# Parse the R08 cross-engine ciphertext fixture (produced by Node) in the
# secret store's TS-written-secret-decrypts test.
serde_json = "1"

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
