[package]
name = "dohc-engine-sync-http"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Blocking HTTP transport adapter for dohc relay replication."

[dependencies]
dohc-engine-sync = { path = "../dohc-engine-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
base64 = "0.22"
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
rusqlite = "0.37"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
