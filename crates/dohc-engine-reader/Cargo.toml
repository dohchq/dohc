[package]
name = "dohc-engine-reader"
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Trusted-startup Markdown reader process owner; no engine dispatch."
autotests = false

[dependencies]
dohc-engine-protocol = { path = "../dohc-engine-protocol", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }

[lints]
workspace = true
