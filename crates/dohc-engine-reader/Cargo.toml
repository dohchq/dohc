[package]
name = "dohc-engine-reader"
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Trusted-startup Markdown reader process owner; no engine dispatch."
autotests = false

[features]
test-support = []
[dependencies]
dohc-engine-protocol = { path = "../dohc-engine-protocol", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
