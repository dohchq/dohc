[package]
license.workspace = true
name = "dohc-engine-sync"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Replication substrate: durable journals and cursors, ordered idempotent imported-op application, share scoping, and a dependency-free relay transport seam."

[dependencies]
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-files = { path = "../dohc-engine-files" }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
base64 = "0.23"

[target.'cfg(target_vendor = "apple")'.dependencies]
# Finds the workspace of a store opened through its folder's ID.
dohc-macos-files = { path = "../dohc-macos-files" }

[target.'cfg(target_os = "linux")'.dependencies]
# Finds the workspace of a store opened through a held descriptor.
dohc-linux-files = { path = "../dohc-linux-files" }

[dev-dependencies]
yrs = "=0.27.3"
quote = "1"
syn = { version = "2", features = ["full"] }
dohc-engine-collab = { path = "../dohc-engine-collab", features = ["test-support"] }
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
# Builds a store as the build before agent ids left it.
dohc-engine-storage = { path = "../dohc-engine-storage", features = ["test-support"] }

[lints]
workspace = true
