[package]
name = "dohc-engine-sync"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "R10 dormant replication substrate: durable journals and cursors, ordered idempotent imported-op application, share scoping, and a trait-seamed relay client boundary. No production HTTP runtime is wired until R13."

[features]
fault-injection = ["dohc-engine-storage/fault-injection"]

[dependencies]
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-files = { path = "../dohc-engine-files" }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
dohc-engine-testkit = { path = "../dohc-engine-testkit" }

[lints]
workspace = true
