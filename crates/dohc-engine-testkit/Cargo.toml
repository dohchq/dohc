[package]
name = "dohc-engine-testkit"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "CAL-1 calibration slice: fixtures (scratch workspaces, path aliases, adversarial v1/foreign databases) and the in-process crash/restart harness with named fault points. Dormant test infrastructure; not wired into the product."

[dependencies]
dohc-test-scratch = { path = "../dohc-test-scratch" }
# `EngineDbScan` scans for the base64 form of a secret plaintext, because
# ciphertext reaches SQLite as base64 TEXT. The encoder must be the one
# production uses, or the scan would look for the wrong bytes.
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
# The testkit is the crash tier: it turns ON the storage fault-injection seam.
# Feature unification then arms the seam for the whole `cargo test --workspace`
# build (storage, runtime, and these integration traces), while a release
# artifact that does not link the testkit keeps the seam compiled out.
dohc-engine-storage = { path = "../dohc-engine-storage", features = ["fault-injection"] }
dohc-engine-runtime = { path = "../dohc-engine-runtime", features = ["fault-injection"] }
# The materialization pipeline (filesystem half of the crash boundary). Its
# fault-injection feature (delegating to storage's) is enabled here so
# `cargo test --workspace` arms the materialize.* fault points for the crash
# tier. A release artifact that does not link the testkit compiles them out.
dohc-engine-files = { path = "../dohc-engine-files", features = ["fault-injection"] }
# Used only to construct adversarial fixtures (v1-fingerprint / foreign
# databases) that the storage fence must reject. Same bundled build as
# dohc-engine-storage, so no second SQLite compile.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# Drives the async actor-loop traces (cancellation + deadline). The synchronous
# CAL-1 traces need no runtime; these exercise the tokio command path.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
