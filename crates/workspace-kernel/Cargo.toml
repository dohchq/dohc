[package]
name = "dohc-workspace-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
# Cargo 1.82 is the local baseline in this repo environment; newer tempfile
# releases pull transitive crates that require the edition2024 Cargo feature.
tempfile = "=3.10.1"
