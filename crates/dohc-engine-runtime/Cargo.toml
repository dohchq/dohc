[package]
name = "dohc-engine-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "CAL-1/CAL-2 calibration slice: the workspace actor that owns the storage writer connection on ONE dedicated blocking thread, driven by a tokio command loop with cancellation tokens and deadlines, keyed by canonical engine.db file identity, with an explicit open→ready→draining→closed lifecycle and deterministic Drop. Dormant; not wired into the product."

[features]
# Forwards the storage crash-injection seam so a build that arms faults (the
# testkit / `cargo test --workspace`) also arms them under the actor loop.
fault-injection = ["dohc-engine-storage/fault-injection"]

[dependencies]
serde_json = "1"
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-sync = { path = "../dohc-engine-sync" }
dohc-engine-sync-http = { path = "../dohc-engine-sync-http" }
dohc-engine-files = { path = "../dohc-engine-files" }
# OS file identity (POSIX dev+ino, Windows volume+file-index) as a hashable
# value. Encapsulates the platform FFI so the engine crates keep
# forbid(unsafe_code).
file-id = "0.2"
thiserror = "2"
# R12 search composes its FTS/policy SQL against the connection the storage core
# hands it (via read_with/write_with), same seam the versioning/chat domains use.
# `bundled` already compiles SQLite with FTS5 + the trigram tokenizer
# (libsqlite3-sys 0.35 build.rs: -DSQLITE_ENABLE_FTS5; bundle 3.50.2) — no extra
# feature needed. Same version the storage/domain crates content-address with.
rusqlite = { version = "0.40", features = ["bundled"] }
# The async command loop. The writer connection still lives on ONE dedicated
# blocking OS thread (never on the runtime); commands flow over tokio::sync
# channels and the worker receives them via `blocking_recv`.
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
# Cooperative cancellation tree (PORTING.md §12): session/deadline cancellation
# is checked BETWEEN bounded units, never inside a transaction.
tokio-util = "0.7"

[dev-dependencies]
yrs = "=0.27.3"
tokio = { version = "1", features = [
  "sync",
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
] }
# Scratch workspaces + realistic file/chat fixtures for the search traces. The
# domain crate creates versions/snapshots + chat threads/messages exactly as the
# product would, so the FTS index is fed non-tautological data. Depending on the
# testkit also unifies the storage `fault-injection` feature ON for `cargo test`,
# arming the crash-injection at the index-commit boundary.
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
rusqlite = { version = "0.40", features = ["bundled"] }

# Inherit the workspace Rust policy lints (unsafe_code = "forbid", clippy).
[lints]
workspace = true
