[package]
name = "dohc-workspace-engine"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "R13 shadow-only workspace engine daemon composition and replay harness."

[dependencies]
# Constant-time token comparison on the daemon handshake. Already in the
# lockfile transitively; this makes it a direct dependency.
subtle = { version = "2.6", default-features = false }
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-files = { path = "../dohc-engine-files" }
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-runtime = { path = "../dohc-engine-runtime" }
dohc-engine-sync = { path = "../dohc-engine-sync" }
dohc-engine-protocol = { path = "../dohc-engine-protocol" }
dohc-test-scratch = { path = "../dohc-test-scratch", optional = true }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs4 = "1.1.0"
getrandom = "0.3"
sha2 = "0.10.9"
filetime = { version = "0.2", optional = true }
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the capture sink's symlink-refusing reopen.
libc = "0.2"

[features]
# Compiles the harness-only marker writers (e.g.
# `write_rehearsal_token_for_harness`); production builds must not enable it.
# `tokio/process` lives here because only the harness-gated soak runner
# spawns child processes.
harness = ["tokio/process", "dep:filetime", "dep:dohc-test-scratch"]

[dev-dependencies]
# `test-util` gives the driver-loop tests paused virtual time, so they can
# assert what the supervision loop actually WAITS on (a 30s terminal probe
# costs the suite nothing) instead of asserting on the tracker beside it.
tokio = { version = "1", features = ["test-util"] }
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
# Self-dependency so integration tests (tests/shadow_replay.rs) compile the
# library with the harness-only marker writers; production builds never do.
dohc-workspace-engine = { path = ".", features = ["harness"] }
yrs = "=0.27.3"

[lints]
workspace = true

# The soak runner writes shadow markers, so it only exists under the
# harness feature — production builds never compile it.
[[bin]]
name = "dohc-soak-runner"
required-features = ["harness"]

[[bin]]
name = "dohc-rehearsal-harness"
required-features = ["harness"]
