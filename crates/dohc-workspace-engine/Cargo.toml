[package]
name = "dohc-workspace-engine"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "R13 shadow-only workspace engine daemon composition and replay harness."

[dependencies]
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-files = { path = "../dohc-engine-files" }
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-runtime = { path = "../dohc-engine-runtime" }
dohc-engine-sync = { path = "../dohc-engine-sync" }
dohc-engine-protocol = { path = "../dohc-engine-protocol" }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs4 = "1.1.0"
sha2 = "0.10.9"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the capture sink's symlink-refusing reopen.
libc = "0.2"

[features]
# Compiles the harness-only marker writers (e.g.
# `write_rehearsal_token_for_harness`); production builds must not enable it.
harness = []

[dev-dependencies]
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
# Self-dependency so integration tests (tests/shadow_replay.rs) compile the
# library with the harness-only marker writers; production builds never do.
dohc-workspace-engine = { path = ".", features = ["harness"] }
yrs = "=0.27.3"

[lints]
workspace = true
