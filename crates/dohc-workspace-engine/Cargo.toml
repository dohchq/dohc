[package]
license.workspace = true
name = "dohc-workspace-engine"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "The workspace engine daemon the desktop app runs: composes the engine crates behind the framed stdio protocol."

[dependencies]
# Constant-time token comparison on the daemon handshake. Already in the
# lockfile transitively; this makes it a direct dependency.
subtle = { version = "2.6", default-features = false }
dohc-engine-storage = { path = "../dohc-engine-storage" }
dohc-engine-domain = { path = "../dohc-engine-domain" }
dohc-engine-files = { path = "../dohc-engine-files" }
dohc-engine-crypto = { path = "../dohc-engine-crypto" }
dohc-engine-collab = { path = "../dohc-engine-collab" }
dohc-engine-runtime = { path = "../dohc-engine-runtime" }
dohc-engine-sync = { path = "../dohc-engine-sync" }
dohc-engine-protocol = { path = "../dohc-engine-protocol" }
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
sha2 = "0.11"
file-id = "0.2"
fs4 = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the capture sink's symlink-refusing reopen.
libc = "0.2"

[features]
# Enables capture probe state and controls plus marker hooks (`*_for_harness`).
# The probe type exists in all builds; production builds must not enable this feature.
harness = []

[dev-dependencies]
dohc-engine-collab = { path = "../dohc-engine-collab", features = ["test-support"] }
# `test-util` gives the driver-loop tests paused virtual time, so they can
# assert what the supervision loop actually WAITS on (a 30s terminal probe
# costs the suite nothing) instead of asserting on the tracker beside it.
tokio = { version = "1", features = ["test-util", "net"] }
dohc-engine-testkit = { path = "../dohc-engine-testkit" }
proptest = "1"
# Self-dependency so integration tests compile the library with the
# harness-only hooks; production builds never do.
dohc-workspace-engine = { path = ".", features = ["harness"] }

[lints]
workspace = true
