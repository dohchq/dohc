services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dohc
      POSTGRES_USER: dohc
      POSTGRES_PASSWORD: dohc
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dohc -d dohc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dohc_dev_postgres:/var/lib/postgresql/data

volumes:
  dohc_dev_postgres:
