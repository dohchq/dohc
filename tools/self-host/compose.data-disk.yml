# Keeps relay, continuity and host data in folders on one attached disk.
# They stay named volumes so archive can find them. A missing folder fails the
# volume mount instead of starting a fresh deployment, because Docker does not
# create the device folder of a bound volume.
services:
  # The data-disk check runs in this service and reads all three folders.
  relay-initialize:
    volumes: [dohc_self_host_host_data:/host-data:ro]
volumes:
  dohc_self_host_sync_relay:
    driver: local
    driver_opts: {type: none, o: bind, device: '${DOHC_DATA_DIRECTORY:?Set DOHC_DATA_DIRECTORY}/sync-relay'}
  dohc_self_host_relay_continuity:
    driver: local
    driver_opts: {type: none, o: bind, device: '${DOHC_DATA_DIRECTORY:?Set DOHC_DATA_DIRECTORY}/continuity'}
  dohc_self_host_host_data:
    driver: local
    driver_opts: {type: none, o: bind, device: '${DOHC_DATA_DIRECTORY:?Set DOHC_DATA_DIRECTORY}/host-data'}
