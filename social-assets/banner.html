<!doctype html><meta charset="utf-8"><style>
  /* Fonts and the engine image come from the site; run pnpm install first. */
  @font-face{font-family:'Inter';font-weight:100 900;
    src:url('../apps/site/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2')}
  @font-face{font-family:'Source Serif 4';font-weight:200 900;

  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:640px}
  body{position:relative;background:#f7f6f1;color:#151515;overflow:hidden;
       font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .grid{position:absolute;inset:0;
        background-image:linear-gradient(rgba(21,21,21,.06) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(21,21,21,.06) 1px,transparent 1px),
                         linear-gradient(rgba(21,21,21,.028) 1px,transparent 1px),

  .engine{position:absolute;left:624px;top:-4px;width:648px;height:648px}
  .copy{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:14px}
  .brand svg{width:34px;height:37px}
  .lobe{fill:none;stroke:#2d342e;stroke-width:8;stroke-linejoin:round}
  .dot{fill:#2d342e}
  .word{font-weight:780;font-size:34px;line-height:1}
  h1{margin-top:44px;font:500 76px/1.02 'Source Serif 4',Georgia,serif;letter-spacing:-.028em}
  em{position:relative;display:inline-block}
  em svg{position:absolute;left:-2%;bottom:-.12em;width:104%;height:.18em;overflow:visible}
  .note{margin-top:40px;color:#66635d;font:500 26px/1.4 'Inter',system-ui,sans-serif}
