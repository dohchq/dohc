# cargo-deny policy for the dohc Rust workspace.
#
# The gate (tools/rust-engine-program/run-rust-checks.mjs) runs `cargo deny
# check` and skips with a warning when cargo-deny is not installed. Uses the
# current cargo-deny config schema (version = 2 tables).

[graph]
# The two targets the gate runs on: native Windows x64 and Linux x64 via WSL.
# macOS has no gate run yet.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# RustSec advisory database. `unmaintained`/`yanked` warn so a transient
# upstream flag never blocks the gate; real vulnerabilities still fail.
# cargo-deny fails on any advisory not listed in `ignore`.
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses acceptable for a shipped desktop app. Add licenses here
# deliberately, with review, as the dependency set grows.
version = 2
# Only licenses currently present in the graph. Add new ones deliberately,
# with review, as dependencies are introduced.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Zlib: permissive, OSI-approved, FSF-libre. Enters via
    # foldhash (rusqlite → hashlink → hashbrown → foldhash).
    "Zlib",
    # BSD-3-Clause: permissive, OSI-approved, FSF-libre. Enters via
    # `subtle` (aes-gcm → constant-time tag comparison) in dohc-engine-crypto.
    "BSD-3-Clause",
    # ISC: permissive, OSI-approved, FSF-libre. Enters via inotify and
    # inotify-sys through the notify watcher on Linux.
    "ISC",
    # CC0-1.0: public-domain dedication with a permissive fallback. Enters via
    # the notify watcher crate itself.
    "CC0-1.0",
    # CDLA-Permissive-2.0: permissive data license for the Mozilla CA root
    # dataset bundled by webpki-roots (ureq -> rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our own workspace crates are unpublished (publish = false) and carry no
# `license` field; skip license evaluation for them.
private = { ignore = true }

[bans]
# Duplicate versions warn; flip to "deny" once the crate graph stabilizes.
multiple-versions = "warn"
wildcards = "allow"
# Nothing is hard-banned yet. Banned patterns (unbounded channels,
# mem::forget, etc.) are enforced by clippy and review, not crate bans.
deny = []

[sources]
# Only crates.io. Any git/registry source must be added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
