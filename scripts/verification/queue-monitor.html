<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification queue</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --card: #fff; --fg: #1d1d22; --muted: #6b6b76; --line: #e3e3e8; --track: #ececf0;
    --pass: #1f9d55; --fail: #d64545; --machine: #d98a00; --run: #2f6fde; --other: #9a9aa5; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #1a1a1f; --fg: #ececf1; --muted: #9a9aa6; --line: #2b2b33; --track: #23232a;
    --pass: #3cbf72; --fail: #ef6464; --machine: #f0a52a; --run: #5b8ff0; --other: #6d6d78; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 22px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  a { color: inherit; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-family: var(--mono); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .ok { color: var(--pass); } .bad { color: var(--fail); } .warn { color: var(--machine); }
  .banner { border: 1px solid var(--machine); color: var(--machine); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .banner.bad { border-color: var(--fail); color: var(--fail); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .lane[data-id] { cursor: pointer; }
  .lane .br { font-family: var(--mono); font-size: 14px; margin: 4px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .between { display: flex; justify-content: space-between; gap: 10px; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; background: var(--run); border-radius: 4px; }
  .bar i.late { background: var(--machine); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--track); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--track); color: var(--fg); }
  .row { position: relative; height: 30px; margin: 0 0 6px 54px; background: var(--track); border-radius: 4px; }
  .row .label { position: absolute; left: -54px; top: 6px; font-size: 12px; color: var(--muted); }
  .run { position: absolute; top: 3px; bottom: 3px; min-width: 3px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; box-shadow: 0 0 0 1px var(--card); }
  .run:hover, .run:focus-visible { filter: brightness(1.2); outline: 2px solid var(--fg); outline-offset: 1px; }
  .passed { background: var(--pass); } .failed { background: var(--fail); } .environment, .error { background: var(--machine); }
  .cancelled, .interrupted { background: var(--other); }
  .running { background: var(--run); background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.28) 5px 10px); }
  .axis { position: relative; height: 18px; margin-left: 54px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr[data-id] { cursor: pointer; } tr[data-id]:hover td { background: var(--track); }
  .wrap { overflow-x: auto; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 99px; border: 1px solid currentColor; margin-left: 6px; white-space: nowrap; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; }
  .days, .daylabels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .days { align-items: end; height: 140px; }
  .day { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 2px; }
  .day .stack { display: flex; flex-direction: column-reverse; gap: 2px; }
  .day .stack i { display: block; border-radius: 3px; }
  .day .count { text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  .daylabels { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  #tip { position: fixed; z-index: 5; pointer-events: none; display: none; max-width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  dialog { width: min(960px, 96vw); max-height: 90vh; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dhead { position: sticky; top: 0; background: var(--card); padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  .dbody { padding: 12px 16px 18px; display: grid; gap: 14px; }
  .close { border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; align-self: start; }
  pre { margin: 6px 0 0; max-height: 360px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; }
  @media (prefers-reduced-motion: no-preference) { .bar i { transition: width .6s ease; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Verification queue</h1>
    <span id="service" class="pill">loading</span>
    <span id="updated" class="muted small"></span>
  </header>
  <div id="banners"></div>
  <section class="tiles" id="tiles"></section>
  <section><h2>Running now</h2><div class="lanes" id="lanes"></div></section>
  <section>
    <div class="between"><h2 id="timeline-title">Last 24 hours</h2>
      <div class="seg" role="group" aria-label="Time range"><button data-range="1" aria-pressed="true">24 h</button><button data-range="7" aria-pressed="false">7 days</button></div></div>
    <div id="timeline"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section><h2>Waiting</h2><div class="wrap"><table id="queue"></table></div></section>
  <section class="grid2">
    <div><h2>Runs per day</h2><div id="days"></div></div>
    <div><h2>Nightly run of main</h2><div id="nightly" class="card"></div></div>
  </section>
  <section><h2>Recent runs</h2><div class="wrap"><table id="recent"></table></div></section>
  <section class="grid2">
    <div><h2>Flaky tests, last 7 days</h2><div class="wrap"><table id="flaky"></table></div></div>
    <div><h2>Slowest tests, last 7 days</h2><div class="wrap"><table id="slowest"></table></div></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<dialog id="details" aria-labelledby="details-title"><div class="dhead"><div><div id="details-title" class="mono"></div><div id="details-sub" class="muted small"></div></div><button class="close" id="details-close">Close</button></div><div class="dbody" id="details-body"></div></dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const MIN = 60_000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const clock = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
const dayName = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric" });
const at = t => clock.format(new Date(t));
const dur = ms => ms == null ? "unknown" : ms >= HOUR ? `${Math.floor(ms / HOUR)} h ${String(Math.round(ms % HOUR / MIN)).padStart(2, "0")} m` : `${Math.max(0, Math.round(ms / MIN))} min`;
const ago = t => `${dur(Date.now() - t)} ago`;
const outcomes = {
  passed: ["✓", "Passed"], failed: ["✕", "Failed"], environment: ["⚠", "Machine failure, retried"], error: ["⚠", "Host gave up"],
  cancelled: ["–", "Cancelled"], superseded: ["–", "Replaced by a newer commit"], interrupted: ["–", "Interrupted"], running: ["●", "Running"], queued: ["●", "Waiting"],
};
const outcomeLabel = o => (outcomes[o] ?? ["", o]).join(" ");
const tone = o => o === "passed" ? "ok" : o === "failed" ? "bad" : "warn";
const pr = branch => branch === "main (nightly)" ? "https://github.com/dohchq/dohc/commits/main" : `https://github.com/dohchq/dohc/pulls?q=is%3Apr+head%3A${encodeURIComponent(branch)}`;
let state = null, range = 1;
const length = run => (run.endedAt ? Date.parse(run.endedAt) : state.now) - Date.parse(run.startedAt);

// Attempts recorded before the service stored lanes take the first lane free at their start.
function lanesOf(runs) {
  const free = [0, 0];
  for (const run of runs) {
    const end = run.endedAt ? Date.parse(run.endedAt) : Infinity;
    if (!run.lane) {
      const start = Date.parse(run.startedAt);
      run.lane = free[0] <= start ? 1 : free[1] <= start ? 2 : free[0] <= free[1] ? 1 : 2;
    }
    free[run.lane - 1] = end;
  }
  return runs;
}

// Each lane frees when its run reaches the typical time; each waiting request then takes the typical time.
function startTimes(s, running) {
  const lanes = s.service?.lanes ?? 1;
  const free = running.map(run => s.now + Math.max((s.typicalMs ?? 0) - (run.awakeMs ?? 0), 5 * MIN));
  while (free.length < lanes) free.push(s.now);
  return s.queued.map(q => {
    free.sort((a, b) => a - b);
    const starts = Math.max(free[0], q.notBefore ? Date.parse(q.notBefore) : 0);
    free[0] = starts + (s.typicalMs ?? 0);
    return starts;
  });
}

function renderHeader(s) {
  const svc = s.service;
  const beat = svc ? Date.parse(svc.heartbeatAt) : null;
  $("service").innerHTML = !svc ? '<span class="bad">● service never started</span>'
    : svc.alive ? `<span class="ok">● running</span> <span class="muted">${esc(svc.commit ?? "")}</span>`
    : `<span class="bad">● not responding since ${esc(at(beat))}</span>`;
  $("updated").textContent = `updated ${at(s.now)}`;
  const banners = [];
  if (svc && !svc.alive) banners.push(`<div class="banner bad">The service has not checked in for ${esc(dur(s.now - beat))}, so nothing new starts. Task Scheduler restarts it within five minutes. If it stays down, run pnpm verify:queue restart.</div>`);
  if (svc?.health?.reason) banners.push(`<div class="banner">${esc(svc.health.reason)}</div>`);
  $("banners").innerHTML = banners.join("");
}

function renderTiles(s, finished, running, starts) {
  const lanes = s.service?.lanes ?? 1;
  const day = finished.filter(run => Date.parse(run.endedAt) > s.now - DAY);
  const count = list => day.filter(run => list.includes(run.outcome)).length;
  const oldest = Math.min(...s.queued.map(q => Date.parse(q.submittedAt)));
  const clears = s.queued.length && s.typicalMs ? starts.at(-1) + s.typicalMs : null;
  const health = s.service?.health ?? {};
  const tiles = [
    ["Running", `${running.length} of ${lanes}`, lanes === 1 ? "lane busy" : "lanes busy"],
    ["Waiting", s.queued.length, s.queued.length ? `oldest waited ${dur(s.now - oldest)}` : "nothing waiting", s.queued.length > 2 * lanes],
    ["Line clears", clears ? `≈ ${at(clears)}` : "now", clears ? `in ${dur(clears - s.now)}, if nothing new arrives` : "no backlog", clears && clears - s.now > 2 * HOUR],
    ["Last 24 h", day.length, `${count(["passed"])} passed · ${count(["failed"])} failed · ${count(["environment", "error"])} machine`],
    ["Typical passing gate", s.typicalMs ? dur(s.typicalMs) : "unknown", `${(day.length / 24).toFixed(1)} runs an hour`],
    ["Host", health.cpuBusyPercent != null ? `${health.cpuBusyPercent}% CPU` : "unknown",
      `${health.freeMemGb ?? "?"} GB free memory · ${health.diskFreeGb != null ? Math.round(health.diskFreeGb) : "?"} GB disk · Docker ${health.dockerOk === false ? "down" : "up"}`],
  ];
  $("tiles").innerHTML = tiles.map(([k, v, sub, warn]) => `<div class="card tile"><div class="muted small">${esc(k)}</div><div class="v${warn ? " warn" : ""}">${esc(v)}</div><div class="muted small">${esc(sub)}</div></div>`).join("");
}

function renderLanes(s, running) {
  const cards = [];
  for (let lane = 1; lane <= Math.max(s.service?.lanes ?? 1, ...running.map(run => run.lane)); lane += 1) {
    const run = running.find(r => r.lane === lane);
    if (!run) { cards.push(`<div class="card lane"><div class="muted small">Lane ${lane}</div><div class="br muted">idle</div></div>`); continue; }
    const pct = s.typicalMs ? Math.min(100, (run.awakeMs ?? 0) / s.typicalMs * 100) : 0;
    const late = s.typicalMs && run.awakeMs > s.typicalMs * 1.25;
    cards.push(`<div class="card lane" data-id="${esc(run.id)}" data-attempt="${run.attempt}" role="button" tabindex="0">
      <div class="between muted small"><span>Lane ${lane}${run.attempt > 1 ? ` · attempt ${run.attempt}` : ""}</span><span>${esc(run.phase ?? "")}</span></div>
      <div class="br" title="${esc(run.branch)}">${esc(run.branch)}</div>
      <div class="bar"><i class="${late ? "late" : ""}" style="width:${pct}%"></i></div>
      <div class="between muted small"><span>${esc(dur(run.awakeMs))} running</span><span>typical ${esc(dur(s.typicalMs))}</span></div>
      <div class="chips">${(run.steps ?? []).map(step => `<span class="chip">${esc(step)}</span>`).join("")}${run.done ? `<span class="chip muted">${run.done} steps done</span>` : ""}</div></div>`);
  }
  $("lanes").innerHTML = cards.join("");
}

function renderTimeline(s, runs) {
  const span = range * DAY, start = s.now - span;
  const pos = t => `${Math.max(0, (t - start) / span * 100).toFixed(3)}%`;
  const lanes = Math.max(s.service?.lanes ?? 1, ...runs.map(run => run.lane));
  let html = "";
  for (let lane = 1; lane <= lanes; lane += 1) {
    html += `<div class="row"><span class="label">Lane ${lane}</span>` + runs.filter(run => run.lane === lane && (run.endedAt ? Date.parse(run.endedAt) : s.now) > start).map(run => {
      const from = Math.max(Date.parse(run.startedAt), start);
      const to = run.endedAt ? Date.parse(run.endedAt) : s.now;
      return `<button class="run ${esc(run.outcome)}" data-id="${esc(run.id)}" data-attempt="${run.attempt}" aria-label="${esc(`${run.branch}: ${outcomeLabel(run.outcome)}`)}" style="left:${pos(from)};width:calc(${((to - from) / span * 100).toFixed(3)}% - 2px)"></button>`;
    }).join("") + "</div>";
  }
  const step = range === 1 ? 3 * HOUR : DAY;
  const offset = new Date(s.now).getTimezoneOffset() * MIN;
  let ticks = "";
  for (let t = Math.ceil((start - offset) / step) * step + offset; t <= s.now; t += step) ticks += `<span style="left:${pos(t)}">${esc(range === 1 ? at(t) : dayName.format(new Date(t)))}</span>`;
  $("timeline").innerHTML = `${html}<div class="axis">${ticks}</div>`;
  $("timeline-title").textContent = range === 1 ? "Last 24 hours" : "Last 7 days";
  $("legend").innerHTML = ["passed", "failed", "environment", "running", "cancelled"].map(o => `<span><i class="${o}"></i>${esc(outcomeLabel(o))}</span>`).join("") + '<span>Click a run for its steps and logs.</span>';
}

function renderQueue(s, starts) {
  const rows = s.queued.map((q, i) => {
    const tags = `${q.nightly ? '<span class="tag ok">nightly, goes first</span>' : ""}${q.retry ? '<span class="tag warn">retry</span>' : ""}${q.scope !== "all" ? `<span class="tag">${esc(q.scope)} only</span>` : ""}`;
    return `<tr><td class="n">${i + 1}</td><td><a class="mono" href="${esc(pr(q.branch))}" target="_blank" rel="noreferrer">${esc(q.branch)}</a>${tags}${q.waiting ? `<div class="muted small">${esc(q.waiting)}</div>` : ""}</td>
      <td class="n">${esc(dur(s.now - Date.parse(q.submittedAt)))}</td><td class="n">${s.typicalMs ? `≈ ${esc(at(starts[i]))}` : "unknown"}</td></tr>`;
  });
  $("queue").innerHTML = rows.length ? `<tr><th class="n">#</th><th>Branch</th><th class="n">Waited</th><th class="n">Starts</th></tr>${rows.join("")}` : '<tr><td class="muted">Nothing is waiting.</td></tr>';
}

function renderDays(s, finished) {
  const days = [];
  const today = new Date(s.now); today.setHours(0, 0, 0, 0);
  for (let i = 6; i >= 0; i -= 1) {
    const from = new Date(today); from.setDate(today.getDate() - i);
    const to = new Date(from); to.setDate(from.getDate() + 1);
    const runs = finished.filter(run => Date.parse(run.endedAt) >= from && Date.parse(run.endedAt) < to);
    const passing = runs.filter(run => run.outcome === "passed").map(run => run.awakeMs).sort((a, b) => a - b);
    days.push({ label: dayName.format(from), passed: runs.filter(r => r.outcome === "passed").length, failed: runs.filter(r => r.outcome === "failed").length,
      machine: runs.filter(r => r.outcome === "environment" || r.outcome === "error").length, typical: passing.length ? passing[Math.floor(passing.length / 2)] : null });
  }
  const most = Math.max(1, ...days.map(d => d.passed + d.failed + d.machine));
  const block = (n, cls, name) => n ? `<i class="${cls}" style="height:${n / most * 104}px" title="${n} ${name}"></i>` : "";
  $("days").innerHTML = `<div class="card"><div class="days">${days.map(d => `<div class="day"><div class="count">${d.passed + d.failed + d.machine || ""}</div><div class="stack">${block(d.passed, "passed", "passed")}${block(d.failed, "failed", "failed")}${block(d.machine, "environment", "machine failures")}</div></div>`).join("")}</div>
    <div class="daylabels">${days.map(d => `<span>${esc(d.label)}</span>`).join("")}</div>
    <div class="daylabels">${days.map(d => `<span>${d.typical ? esc(dur(d.typical)) : ""}</span>`).join("")}</div>
    <div class="legend"><span><i class="passed"></i>Passed</span><span><i class="failed"></i>Failed</span><span><i class="environment"></i>Machine failure</span><span>Bottom row: the median passing gate</span></div></div>`;
}

function renderNightly(s) {
  const n = s.nightly, p = s.lastNightlyPass;
  const line = n ? `<div><span class="${tone(n.state)}">${esc(outcomeLabel(n.state))}</span> · main at <span class="mono">${esc(n.head)}</span>${n.at ? ` · ${esc(ago(Date.parse(n.at)))}` : ""}</div>` : '<div class="muted">No nightly run yet.</div>';
  $("nightly").innerHTML = `${line}<div class="muted small" style="margin-top:6px">Last pass: ${p ? `<span class="mono">${esc(p.head)}</span>${p.at ? `, ${esc(ago(Date.parse(p.at)))}` : ""}` : "none yet"}. It runs every night at 03:07, ahead of the line.</div>`;
}

function renderRecent(finished) {
  const rows = finished.slice(-30).reverse().map(run => `<tr data-id="${esc(run.id)}" data-attempt="${run.attempt}" tabindex="0">
    <td class="n">${esc(at(Date.parse(run.endedAt)))}</td><td><span class="mono">${esc(run.branch)}</span>${run.attempt > 1 ? `<span class="tag">attempt ${run.attempt}</span>` : ""}</td>
    <td><span class="${tone(run.outcome)}">${esc(outcomeLabel(run.outcome))}</span>${run.outcome !== "passed" && run.cause && run.cause !== "check" ? `<div class="muted small">${esc(run.cause)}</div>` : ""}</td>
    <td class="n">${esc(dur(length(run)))}</td><td class="n">${run.flaky ? `<span class="warn">${run.flaky} flaky</span>` : ""}</td></tr>`);
  $("recent").innerHTML = rows.length ? `<tr><th class="n">Ended</th><th>Branch</th><th>Result</th><th class="n">Took</th><th class="n"></th></tr>${rows.join("")}` : '<tr><td class="muted">No runs yet.</td></tr>';
}

function renderTests(s) {
  $("flaky").innerHTML = s.flaky.length ? `<tr><th>Test</th><th class="n">Runs</th><th class="n">Last</th></tr>` + s.flaky.map(t => `<tr><td><div class="mono small">${esc(t.test)}</div><div class="muted small">${esc(t.step)}</div></td><td class="n">${t.flaky}</td><td class="n">${esc(ago(Date.parse(t.last)))}</td></tr>`).join("") : '<tr><td class="muted">No flaky tests this week.</td></tr>';
  $("slowest").innerHTML = s.slowest.length ? `<tr><th>Test</th><th class="n">Median</th><th class="n">Runs</th></tr>` + s.slowest.map(t => `<tr><td><div class="mono small">${esc(t.test)}</div><div class="muted small">${esc(t.step)}</div></td><td class="n">${Math.round(t.medianSeconds)} s</td><td class="n">${t.runs}</td></tr>`).join("") : '<tr><td class="muted">No times recorded yet.</td></tr>';
}

function render() {
  const s = state;
  const runs = lanesOf(s.runs.map(run => ({ ...run })));
  const running = runs.filter(run => run.outcome === "running");
  const finished = runs.filter(run => run.endedAt).sort((a, b) => Date.parse(a.endedAt) - Date.parse(b.endedAt));
  const starts = startTimes(s, running);
  renderHeader(s); renderTiles(s, finished, running, starts); renderLanes(s, running); renderTimeline(s, runs);
  renderQueue(s, starts); renderDays(s, finished); renderNightly(s); renderRecent(finished); renderTests(s);
}

async function refresh() {
  try {
    const response = await fetch("api/state", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state = await response.json();
    render();
  } catch (error) {
    $("service").innerHTML = `<span class="bad">● this page cannot reach the service (${esc(error.message)})</span>`;
  }
}

async function openDetails(id, attempt) {
  const dialog = $("details");
  $("details-title").textContent = "Loading…"; $("details-sub").textContent = ""; $("details-body").innerHTML = "";
  if (!dialog.open) dialog.showModal();
  const response = await fetch(`api/run?id=${encodeURIComponent(id)}&attempt=${encodeURIComponent(attempt)}`, { cache: "no-store" }).catch(() => null);
  const d = response?.ok ? await response.json() : null;
  if (!d) { $("details-title").textContent = "This run is no longer recorded."; return; }
  $("details-title").textContent = d.branch;
  $("details-sub").textContent = `${outcomeLabel(d.outcome ?? d.state)} · attempt ${d.attempt} · ${d.head} against ${d.base} · ${d.startedAt ? at(Date.parse(d.startedAt)) : ""}${d.endedAt ? `–${at(Date.parse(d.endedAt))}` : ", still running"} · ${d.id}`;
  const verdict = v => v === "PASS" ? '<span class="ok">✓ pass</span>' : v === "FAIL" ? '<span class="bad">✕ fail</span>' : v === "RUNNING" ? '<span style="color:var(--run)">● running</span>' : `<span class="muted">${esc(v ?? "not run")}</span>`;
  const failing = d.steps.filter(step => step.verdict === "FAIL");
  $("details-body").innerHTML = `
    ${d.reason ?? d.error ? `<div class="banner${d.outcome === "failed" ? " bad" : ""}">${esc(d.reason ?? d.error)}</div>` : ""}
    ${failing.map(step => `<details open><summary><b>${esc(step.name)}</b> <span class="muted small">failed${step.seconds != null ? ` after ${esc(dur(step.seconds * 1000))}` : ""}</span></summary>${step.error ? `<div class="muted small">${esc(step.error)}</div>` : ""}${step.log ? `<pre>${esc(step.log)}</pre>` : ""}</details>`).join("")}
    ${d.flaky.length ? `<div><h2>Passed only on retry</h2>${d.flaky.map(f => `<div class="small"><span class="mono">${esc(f.test)}</span> <span class="muted">${esc(f.step)}</span></div>`).join("")}</div>` : ""}
    <div><h2>Steps</h2><div class="wrap"><table><tr><th>Step</th><th></th><th class="n">Took</th></tr>${d.steps.map(step => `<tr><td>${step.group === "javascript" ? '<span class="muted">tests › </span>' : ""}${esc(step.name)}</td><td>${verdict(step.verdict)}</td><td class="n">${step.seconds != null ? esc(dur(step.seconds * 1000)) : ""}</td></tr>`).join("")}</table></div></div>
    ${d.slowest.length ? `<div><h2>Slowest tests</h2>${d.slowest.map(t => `<div class="small">${Math.round(t.seconds)} s · <span class="mono">${esc(t.test)}</span> <span class="muted">${esc(t.step)}</span></div>`).join("")}</div>` : ""}`;
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-id]");
  if (target) openDetails(target.dataset.id, target.dataset.attempt);
  const button = event.target.closest("[data-range]");
  if (button) {
    range = Number(button.dataset.range);
    for (const b of document.querySelectorAll("[data-range]")) b.setAttribute("aria-pressed", String(b === button));
    if (state) render();
  }
});
document.addEventListener("keydown", event => {
  const target = event.target.closest?.("[data-id]");
  if (target && target.tagName !== "BUTTON" && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); openDetails(target.dataset.id, target.dataset.attempt); }
});
$("details-close").addEventListener("click", () => $("details").close());
$("timeline").addEventListener("mousemove", event => {
  const el = event.target.closest(".run");
  const tip = $("tip");
  const run = el && state?.runs.find(r => r.id === el.dataset.id && String(r.attempt) === el.dataset.attempt);
  if (!run) { tip.style.display = "none"; return; }
  tip.innerHTML = `<div class="mono">${esc(run.branch)}</div>${esc(outcomeLabel(run.outcome))} · ${esc(dur(length(run)))}<br>${esc(at(Date.parse(run.startedAt)))}–${run.endedAt ? esc(at(Date.parse(run.endedAt))) : "now"}${run.attempt > 1 ? ` · attempt ${run.attempt}` : ""}${run.flaky ? `<br>${run.flaky} flaky test${run.flaky > 1 ? "s" : ""} passed on retry` : ""}${run.cause && !["pass", "check"].includes(run.cause) ? `<br>${esc(run.cause)}` : ""}`;
  tip.style.display = "block";
  tip.style.left = `${Math.min(event.clientX + 12, innerWidth - 330)}px`;
  tip.style.top = `${event.clientY + 14}px`;
});
$("timeline").addEventListener("mouseleave", () => { $("tip").style.display = "none"; });

// Refresh every five seconds while the page is visible, and at once when it comes back.
let timer = null;
const schedule = () => { clearInterval(timer); timer = document.hidden ? null : setInterval(refresh, 5000); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); schedule(); });
refresh(); schedule();
</script>
</body>
</html>
