  <circle cx="48" cy="46" r="34.2" fill="url(#rim)" stroke="#f6f9fb" stroke-width=".8"/>
  <circle cx="48" cy="46" r="31.5" fill="url(#face)" stroke="#8e9ba6" stroke-width=".65"/>
  <circle cx="48" cy="46" r="30.8" fill="url(#light)"/>
