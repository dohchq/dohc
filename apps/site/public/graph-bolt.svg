<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 104" fill="none">
  <defs>
    <linearGradient id="edge" x1="12" y1="24" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f7fa"/><stop offset=".22" stop-color="#a1aab3"/><stop offset=".43" stop-color="#e5e9ed"/><stop offset=".58" stop-color="#646e79"/><stop offset=".8" stop-color="#b4bec7"/><stop offset="1" stop-color="#39434d"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="15" x2="75" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".17" stop-color="#e6ebef"/><stop offset=".42" stop-color="#9da7b0"/><stop offset=".6" stop-color="#f0f3f6"/><stop offset=".8" stop-color="#8b969f"/><stop offset="1" stop-color="#cbd0d2"/>
    </linearGradient>
    <linearGradient id="face" x1="21" y1="18" x2="77" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f3f5"/><stop offset=".28" stop-color="#d9dfe5"/><stop offset=".54" stop-color="#b4bec7"/><stop offset=".78" stop-color="#d4dce2"/><stop offset="1" stop-color="#a4afb8"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(28 23) rotate(48) scale(63 39)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="socket-bevel" x1="34" y1="32" x2="61" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53616d"/><stop offset=".4" stop-color="#86939e"/><stop offset=".62" stop-color="#eff4f7"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
