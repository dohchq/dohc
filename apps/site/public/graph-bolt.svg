      <stop stop-color="#121a21"/><stop offset=".5" stop-color="#34414c"/><stop offset="1" stop-color="#6a7884"/>
    </linearGradient>
    <radialGradient id="socket-floor"><stop stop-color="#303d48"/><stop offset="1" stop-color="#18232d"/></radialGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="210%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="disc"><circle cx="48" cy="46" r="30.8"/></clipPath>
  </defs>
  <ellipse cx="49" cy="88" rx="32" ry="7" fill="#15212b" opacity=".26" filter="url(#shadow)"/>
  <!-- A circular flange beneath the raised socket head. -->
  <circle cx="48" cy="53" r="39" fill="url(#edge)" stroke="#65717c" stroke-width=".8"/>
  <circle cx="48" cy="50" r="39" fill="url(#rim)" stroke="#e7edf1" stroke-width=".8"/>
  <circle cx="48" cy="50" r="36.7" stroke="#667480" stroke-width=".65"/>
  <circle cx="48" cy="50" r="35.8" stroke="#f8fafc" stroke-opacity=".8" stroke-width=".65"/>
