    <circle cx="48" cy="46" r="24"/><circle cx="48" cy="46" r="25"/>
    <circle cx="48" cy="46" r="26"/><circle cx="48" cy="46" r="27"/>
    <circle cx="48" cy="46" r="28"/><circle cx="48" cy="46" r="29"/>
    <circle cx="48" cy="46" r="30"/>
  </g>
  <path d="M17.6 43a30.8 30.8 0 0 1 38.2-26.8" stroke="#fff" stroke-opacity=".8" stroke-width=".7" stroke-linecap="round"/>
  <path d="M76.8 56.4A30.8 30.8 0 0 1 43 76.4" stroke="#687985" stroke-opacity=".5" stroke-width=".65" stroke-linecap="round"/>
