<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="dohc">
  <title>dohc</title>
  <!-- Social preview (1200x630): warm paper, faint grid, stacked
       lockup and a one-line positioning statement. All text inside a
       96px safe margin (brand bible §08). -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(21,21,21,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f7f6f1"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(120 150)">
    <g transform="scale(1.15)">
      <path d="M48 10c14 0 25 9 25 23 0 5-2 9-4 13 10 5 17 15 17 27 0 16-12 27-29 27-12 0-22-5-31-12L12 78C8 68 7 56 10 44 15 23 29 10 48 10Z"
        fill="none" stroke="#2d342e" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="38" cy="58" r="9" fill="#2d342e"/>
    </g>
  </g>
  <text x="120" y="370" font-family="'Aptos','Segoe UI',system-ui,sans-serif" font-size="120" font-weight="780" fill="#151515">dohc</text>
  <text x="120" y="450" font-family="'Iowan Old Style','Charter',Georgia,serif" font-size="40" fill="#66635d">The quiet AI and docs workspace.</text>
  <text x="120" y="505" font-family="'IBM Plex Mono',monospace" font-size="22" fill="#8b867b">work becomes clear, traceable, and ready.</text>
</svg>
