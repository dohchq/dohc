# electron-builder packaging for the dohc desktop app. Build dist/ first
# (electron-vite build), then run electron-builder from apps/desktop.
#
# SIGNING SAFETY — this config never fabricates a signature.
# electron-builder signs only when real credentials are in the environment:
#   macOS:   CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD, plus notarization via
#            APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
#   Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD.
# Without them the artifact is UNSIGNED (scripts/package-smoke.mjs labels it
# "SIGNING: unsigned (dev)"). forceCodeSigning stays unset here so local/dev
# and unsigned nightly dogfood packaging work. Stable release pipelines export
# DOHC_REQUIRE_SIGNING=1 and pass `-c.forceCodeSigning=true` so a missing cert
# fails the build instead of shipping an unsigned stable binary.

appId: app.dohc.desktop
productName: dohc
executableName: dohc
directories:
  output: release
  # App icon: build/icon.png (512px, rendered from icon.svg by
  # scripts/render-icon.mjs); electron-builder derives ico/icns from it.
  buildResources: build
files:
  - dist/**
asar: true
extraResources:
  # Native sidecars must stay outside app.asar. This directory is always
  # created by scripts/build-workspace-kernel.mjs; when cargo is unavailable it
  # is empty and packaging still succeeds. macOS/Windows binaries are produced
  # by running that script on those platforms; a CI matrix that uploads each
  # OS's own binary is a follow-up, not implemented here.
  - from: resources/workspace-kernel
    to: workspace-kernel
    filter:
      - "**/*"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
# Workspace deps are raw TS bundled into dist by electron-vite; nothing needs
# a native rebuild against Electron headers.
npmRebuild: false

# Release hardening: electron-builder flips these via @electron/fuses at
# package time. Dev builds (electron-vite) stay stock — fuses only exist in
# packaged binaries.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # MUST stay true while the renderer loads via window.loadFile: Vite emits
  # crossorigin module scripts/stylesheets, and those are CORS-mode fetches
  # over file:// — exactly the privilege this fuse grants. Disabling it
  # blanks every packaged window (scripts/fuse-smoke.mjs boots a
  # fuse-flipped binary to gate this). Workspace bytes still flow through
  # dohc-file://, never raw file://.
  grantFileProtocolExtraPrivileges: true

mac:
  category: public.app-category.productivity
  # zip is required alongside dmg for macOS auto-updates (electron-updater).
  target: [dmg, zip]
  hardenedRuntime: true
win:
  target: [nsis]
linux:
  target: [AppImage]
  category: Office

fileAssociations:
  - ext: [md, markdown, txt, csv, json]
    name: dohc workspace document
    description: Open with dohc
    role: Editor

# Auto-update feed baked into packaged app-update.yml. GitHub Releases is the
# first dogfood update host because it is available immediately from the
# release workflow. DOHC_UPDATE_URL remains an explicit packaged/mock override
# in src/updates/electronUpdater.ts. Move to https://updates.dohc.com/desktop
# only after the bridge-release runbook in the desktop update plan is complete.
publish:
  provider: github
  owner: dohc-ai
  repo: dohc
  channel: latest
