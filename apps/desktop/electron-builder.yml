# electron-builder packaging for the dohc desktop app. Build dist/ first
# (electron-vite build), then run electron-builder from apps/desktop.
#
# SIGNING SAFETY — this config never fabricates a signature.
# electron-builder signs only when real credentials are present:
#   macOS:   CSC_KEYCHAIN and CSC_NAME name a release keychain and its
#            Developer ID identity, and APPLE_KEYCHAIN with
#            APPLE_KEYCHAIN_PROFILE name its notarytool profile
#            (scripts/release-desktop-macos.mjs sets all four).
#   Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD.
# Without them the artifact is UNSIGNED (scripts/package-smoke.mjs labels it
# "SIGNING: unsigned (dev)"). forceCodeSigning stays unset here so local/dev
# and unsigned nightly dogfood packaging work. Release builds that require
# signing export DOHC_REQUIRE_SIGNING=1 and pass `-c.forceCodeSigning=true` so
# a missing certificate fails the build instead of shipping an unsigned binary.

appId: app.dohc.desktop
productName: dohc
executableName: dohc
directories:
  output: release
  # Windows and Linux use a paper tile, icon.ico and icon.png, that reads on
  # light and dark taskbars; only their tray switches between icon-light.png
  # and icon-dark.png with the OS appearance. macOS uses icon.icns, drawn on
  # Apple's icon grid, and a menu bar template.
  buildResources: build
files:
  - dist/**
  - "!**/*.tsbuildinfo"
  # Source maps go to the error report service, not into the installer.
  - "!dist/**/*.map"
  - "!node_modules/@dohc/*/src/**/*.test.ts"
  - "!node_modules/@dohc/sync-relay/dist/**"
  # Main bundles the Effect runtime; the CLI owns its dependencies.
  - "!node_modules/effect/**"
  - "!node_modules/electron-updater/**"
asar: true
# A direct electron-builder invocation must not be able to silently omit the
# engine sidecar. The hook throws before packaging if staging did not happen.
beforePack: scripts/require-workspace-engine.mjs
extraResources:
  - from: scripts/compiler-node-LICENSE.txt
    to: engine-reader/node-LICENSE.txt
  - from: resources/engine-reader
    to: engine-reader
    filter:
      - "**/*"
  - from: resources/app-backend-runtime
    to: app-backend-runtime
    filter:
      - "**/*"
  - from: resources/app-backend-runtime/node_modules
    to: app-backend-runtime/node_modules
    filter:
      - "**/*"
  - from: resources/app-compiler
    to: app-compiler
    filter:
      - "**/*"
  # electron-builder skips node_modules at each resource's root.
  - from: resources/app-compiler/node_modules
    to: app-compiler/node_modules
    filter:
      - "**/*"
  # The probe owner and relay run outside app.asar. The relay uses
  # app-compiler/node.exe; stage-agent-probe.mjs checks that closure.
  - from: resources/agent-probe
    to: agent-probe
    filter:
      - "**/*"
  - from: build/icon.png
    to: tray-icon.png
  - from: build/icon.png
    to: icon.png
  - from: build/icon-light.png
    to: icon-light.png
  - from: build/icon-dark.png
    to: icon-dark.png
  - from: resources/cli-bin
    to: cli-bin
    filter:
      - "dohc"
      - "dohc.cmd"
      # The dohc-mcp stdio server chat session configs point the user's AI
      # tool at (resolveDohcMcpCommand); staged by build-cli-bin.mjs.
      - "dohc-mcp"
      - "dohc-mcp.cmd"
      - "dohc-mcp.mjs"
  # The opt-in Rust engine is staged by build-workspace-engine.mjs and kept
  # outside app.asar so the main process can execute it directly.
  - from: resources/workspace-engine
    to: workspace-engine
    filter:
      - "dohc-workspace-engine"
      - "dohc-workspace-engine.exe"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
# Workspace deps are raw TS bundled into dist by electron-vite; nothing needs
# a native rebuild against Electron headers.
npmRebuild: false

# Release hardening: electron-builder flips these via @electron/fuses at
# package time. Dev builds (electron-vite) stay stock — fuses only exist in
# packaged binaries.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # MUST stay true while the renderer loads via window.loadFile: Vite emits
  # crossorigin module scripts/stylesheets, and those are CORS-mode fetches
  # over file:// — exactly the privilege this fuse grants. Disabling it
  # blanks every packaged window (scripts/fuse-smoke.mjs checks and boots
  # the packaged binary). Workspace bytes still flow through
  # dohc-file://, never raw file://.
  grantFileProtocolExtraPrivileges: true
  # Flipping a fuse rewrites Electron Framework, which breaks its ad-hoc
  # signature, and Apple silicon refuses to load a framework whose signature
  # does not match. Re-sign ad hoc after the flip; a release identity signs
  # over it.
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.productivity
  # Rendered from build/icon-mac.svg by scripts/render-icon.mjs.
  icon: build/icon.icns
  extraResources:
    - from: build/trayTemplate.png
      to: trayTemplate.png
    - from: build/trayTemplate@2x.png
      to: trayTemplate@2x.png
  # zip is required alongside dmg for macOS auto-updates (electron-updater).
  target: [dmg, zip]
  hardenedRuntime: true
  # Sign Node, then pin its final bytes before the outer app is sealed.
  sign: scripts/sign-engine-reader-macos.mjs
  # Document types are set here, not in fileAssociations, which give each
  # document the full app icon. With CFBundleTypeIconSystemGenerated, macOS
  # draws a page with dohc's icon on it. dohc edits Markdown as its own
  # documents, so it may be their default app, but it never claims to own the
  # type. For text, CSV and JSON it stays an Open With choice and never
  # replaces the app the person uses.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeExtensions: [md, markdown]
        CFBundleTypeName: dohc workspace document
        CFBundleTypeRole: Editor
        LSHandlerRank: Default
        CFBundleTypeIconSystemGenerated: true
      - CFBundleTypeExtensions: [txt, csv, json]
        CFBundleTypeName: dohc workspace document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        CFBundleTypeIconSystemGenerated: true
win:
  # Rendered from build/icon.svg by scripts/render-icon.mjs.
  icon: build/icon.ico
  signExts: ["!node.exe"]
  target: [nsis]
  # The installer adds dohc to Open With for these types.
  fileAssociations:
    - ext: [md, markdown, txt, csv, json]
      name: dohc workspace document
      description: Open with dohc
linux:
  # The .deb links /usr/bin/<executableName>. `dohc` is the chat command agents
  # use (docs/reference/cli-mcp-sdk.md), so the app takes another name, as
  # signal-desktop and github-desktop do.
  executableName: dohc-desktop
  # Without its own icon, the Linux target falls back to mac.icon.
  icon: build/icon.png
  # The AppImage cannot carry Chromium's sandbox helper, so where unprivileged
  # user namespaces are blocked, as on Ubuntu 24.04, it refuses to start. The
  # .deb installs an AppArmor profile that allows them.
  target: [AppImage, deb]
  category: Office
  # A Linux desktop offers dohc under Open With only for the types its desktop
  # entry names. These are the types dohc opens on macOS and Windows.
  mimeTypes: [text/markdown, text/plain, text/csv, application/json]
  # Use package.json desktopName for the launcher filename and StartupWMClass;
  # app.setDesktopName("dohc.desktop") supplies the matching runtime identity.
  syncDesktopName: true
appImage:
  # electron-builder's default AppImage desktop entry passes --no-sandbox.
  # Menu launches, dohc:// links and opened files keep the Chromium sandbox.
  executableArgs: []
deb:
  # A package names who answers for it. The homepage is package.json's.
  maintainer: dohc <sup@dohc.computer>
  # Setting depends replaces electron-builder's default list, so this repeats
  # it and adds two libraries Electron links that the list does not bring:
  # libasound.so.2, which a minimal or server Ubuntu lacks, and libgbm.so.1,
  # which otherwise arrives only with Mesa's EGL packages. Ubuntu 24.04
  # renamed ALSA's package libasound2t64.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1

protocols:
  - name: dohc share link
    schemes: [dohc]

# Auto-update feed baked into packaged app-update.yml. GitHub Releases is the
# first dogfood update host because it is available immediately from the
# release workflow. DOHC_UPDATE_URL remains an explicit packaged/mock override
# in src/updates/electronUpdater.ts.
publish:
  provider: github
  owner: dohchq
  repo: dohc
  channel: latest
