<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src adds the live co-editing websocket: wss: for dohc Cloud /
         TLS self-host, and loopback ws: for local dev. The collab URL always
         comes from the trusted main process (derived from the signed-in
         server), never renderer-chosen; no plaintext ws to arbitrary hosts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: dohc-file:; media-src 'self' dohc-file:; connect-src 'self' dohc-file: wss: ws://localhost:* ws://127.0.0.1:*" />
    <title>dohc</title>
    <style>
      /* Warm paper + graphite, set inline so first paint is never unstyled. */
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf7f2;
        color: #2b2926;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1c1a18;
          color: #e8e4de;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
