<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sites</title>
    <style>
      /* dohc's tokens arrive as custom properties on <html>, so this panel
         names colors the way dohc's own stylesheet does. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--dohc-bg, #fff);
        color: var(--dohc-ink, #111);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        font-size: 13px;
      }
      header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        border-bottom: 1px solid var(--dohc-line, #e5e5e5);
      }
      #count {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        color: var(--dohc-muted, #666);
      }
      button {
        border: 1px solid transparent;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--dohc-panel-2, #f0f0f0);
      }
      #refresh {
        padding: 4px 8px;
        font-size: 11px;
        color: var(--dohc-muted, #666);
      }
      #state {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 24px;
        text-align: center;
        color: var(--dohc-muted, #666);
        font-size: 12px;
      }
      #state strong {
        color: var(--dohc-ink, #111);
        font-size: 12px;
        font-weight: 500;
      }
      #state[hidden],
      #sites[hidden] {
        display: none;
      }
      #sites {
        flex: 1 1 auto;
        margin: 0;
        padding: 8px;
        list-style: none;
        overflow-y: auto;
      }
      #sites li + li {
        margin-top: 8px;
      }
      .site {
        border: 1px solid var(--dohc-line, #e5e5e5);
        border-radius: 8px;
        background: var(--dohc-panel, #fafafa);
      }
      .open {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px 8px 0 0;
        text-align: left;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .tag {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 400;
        color: var(--dohc-muted, #666);
      }
      .root {
        display: block;
        margin-top: 2px;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 11px;
        color: var(--dohc-subtle, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .warning {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--dohc-warning, #a15c00);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 12px 10px;
      }
      .actions button {
        padding: 2px 8px;
        border-color: var(--dohc-line, #e5e5e5);
        font-size: 11px;
        color: var(--dohc-muted, #666);
      }
      #error {
        flex: 0 0 auto;
        margin: 0;
        padding: 8px 12px;
        border-top: 1px solid var(--dohc-line, #e5e5e5);
        color: var(--dohc-danger, #b00);
        font-size: 11px;
        white-space: pre-wrap;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <output id="count" data-testid="sites-count">Loading sites...</output>
      <button id="refresh" type="button" data-testid="sites-refresh">Refresh</button>
    </header>
    <div id="state" data-testid="sites-state">Loading sites...</div>
    <ul id="sites" data-testid="sites-list" hidden></ul>
    <p id="error" data-testid="sites-error" hidden></p>
    <script type="module" src="./index.js"></script>
  </body>
</html>
