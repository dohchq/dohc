# The dohc Rust workspace. `dohc-workspace-engine` builds the daemon the
# desktop app runs; the other crates are its parts, test support, and property
# targets.
[workspace]
resolver = "3"
members = [
    "crates/dohc-engine-protocol",
    "crates/dohc-engine-storage",
    "crates/dohc-engine-domain",
    "crates/dohc-engine-files",
    "crates/dohc-engine-runtime",
    "crates/dohc-engine-testkit",
    "crates/dohc-test-scratch",
    "crates/dohc-engine-crypto",
    "crates/dohc-engine-collab",
    "crates/dohc-engine-sync",
    "crates/dohc-engine-sync-http",
    "crates/dohc-workspace-engine",
    "crates/yrs-interop",
    "crates/dohc-proptest-targets",
]
exclude = [
    "vendor/yrs-0.27.3",
    "vendor/file-guard-0.2.0",
    # Agent worktrees check the repo out inside it. Without this, a crate in
    # a nested checkout walks up past its own workspace root and tries to
    # attach to this one, and cargo fails with "believes it's in a workspace
    # when it's not".
    ".agent-worktrees",
    ".claude/worktrees",
]

[patch.crates-io]
yrs = { path = "vendor/yrs-0.27.3" }
file-guard = { path = "vendor/file-guard-0.2.0" }

# Shared package metadata. Members opt in per field via `field.workspace = true`.
# `edition` is intentionally NOT centralized here: dohc-engine-protocol is
# edition 2024 while yrs-interop is pinned to edition 2021 (its yrs 0.27.3
# baseline), so each crate declares its own edition.
[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-only"
rust-version = "1.85"
publish = false

# `unsafe_code = "forbid"` is enforced in Cargo so the compiler rejects any
# `unsafe` in ordinary crates. Warnings-as-errors is intentionally NOT set
# here: the local runner (tools/rust-engine-program/run-rust-checks.mjs) passes
# clippy `-D warnings`, keeping day-to-day `cargo build`/`cargo check`
# ergonomic while the gate stays strict. Members inherit via
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Strict-but-ergonomic clippy posture; the runner escalates these to errors.
all = { level = "warn", priority = -1 }

# Build economics for the gate and every dev build. Stock `debug = 2` made
# MSVC debuginfo dominate link time and target-dir size across the workspace's
# ~100 linked targets. Members keep line tables so test backtraces still name
# source lines; dependencies carry none — nothing steps through tokio here.
# (Incremental compilation stays on for the dev loop; the gate turns it off
# per run via CARGO_INCREMENTAL=0 in run-rust-checks.mjs.)
[profile.dev]
debug = "line-tables-only"

# The "*" spec matches dependencies only, never workspace members.
[profile.dev.package."*"]
debug = false
