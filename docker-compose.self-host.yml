name: ${DOHC_DEPLOYMENT_NAME:-dohc-self-host}

x-service: &service
  image: ${DOHC_IMAGE:?Run the self-host release build or set DOHC_IMAGE to its release image}
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  networks: [dohc]

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-dohc}
  POSTGRES_USER: ${POSTGRES_USER:-dohc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the self-host bootstrap to generate secrets}

x-auth: &auth
  <<: *database
  NODE_ENV: production
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run the self-host bootstrap to generate secrets}

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment: *database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [dohc_self_host_postgres:/var/lib/postgresql/data]
    networks: [dohc]

  postgres-migrate:
    <<: *service
    restart: 'no'
    command: [migrate]
    environment: *database
    depends_on:
      postgres: {condition: service_healthy}

  relay-initialize:
    <<: *service
    restart: 'no'
    command: [initialize]
    volumes:
      - dohc_self_host_sync_relay:/data
      - dohc_self_host_relay_continuity:/continuity

  workspace-api:
    <<: *service
    command: [workspace-api]
    environment:
      <<: *auth
      WORKSPACE_API_PORT: '1786'
      WORKSPACE_API_BASE_URL: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_WEB_ORIGIN: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_SERVER_RELAY_URL: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_SERVER_NAME: ${DOHC_SERVER_NAME:-dohc}
      DOHC_SERVER_NETWORK_ACCESS: ${DOHC_SERVER_NETWORK_ACCESS:-public}
      DOHC_AUTH_TRUSTED_PROXIES: ${DOHC_GATEWAY_ADDRESS:-10.233.42.2},${DOHC_SHARE_WEB_ADDRESS:-10.233.42.3}
      DOHC_SMTP_HOST: ${DOHC_SMTP_HOST:?Set DOHC_SMTP_HOST}
      DOHC_SMTP_PORT: ${DOHC_SMTP_PORT:-587}
      DOHC_SMTP_SECURE: ${DOHC_SMTP_SECURE:-false}
      DOHC_SMTP_USER: ${DOHC_SMTP_USER:-}
      DOHC_SMTP_PASSWORD: ${DOHC_SMTP_PASSWORD:-}
      DOHC_SMTP_FROM: ${DOHC_SMTP_FROM:?Set DOHC_SMTP_FROM}
    depends_on:
      postgres-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, /app/tools/self-host/health.mjs, workspace-api]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-relay:
    <<: *service
    command: [sync-relay]
    environment:
      <<: *auth
      DOHC_RELAY_LINK_KEY: ${DOHC_RELAY_LINK_KEY:?Run the self-host bootstrap to generate secrets}
      DOHC_RELAY_EXCHANGE_KEY: ${DOHC_RELAY_EXCHANGE_KEY:?Run the self-host bootstrap to generate secrets}
      DOHC_RELAY_SHARE_WEB_ORIGIN: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      SYNC_RELAY_AUTH_BASE_URL: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      SYNC_RELAY_BIND: 0.0.0.0
      SYNC_RELAY_PORT: '1788'
      DOHC_RELAY_DEPLOYMENT_CONFIG: /continuity/deployment.json
      DOHC_SELF_HOST_LIVE: '1'
      DOHC_RELAY_NAMED_LIVE_HOSTS: ${DOHC_PUBLIC_HOST:?Set DOHC_PUBLIC_HOST}
      DOHC_RELAY_SERVICE_HOST_ROOT: /host-data
      DOHC_RELAY_ENGINE_EXECUTABLE: /app/bin/dohc-workspace-engine
      DOHC_RELAY_PUBLIC_ORIGIN: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_RELAY_APP_PUBLICATIONS: ${DOHC_RELAY_APP_PUBLICATIONS:-0}
      DOHC_RELAY_APP_BACKEND_MAX_PARTICIPANTS_PER_GRANT: ${DOHC_RELAY_APP_BACKEND_MAX_PARTICIPANTS_PER_GRANT:-1000}
      DOHC_RELAY_APP_COLLECTION_MAX_CREATES_PER_GRANT: ${DOHC_RELAY_APP_COLLECTION_MAX_CREATES_PER_GRANT:-0}
    depends_on:
      postgres-migrate: {condition: service_completed_successfully}
      relay-initialize: {condition: service_completed_successfully}
    volumes:
      - dohc_self_host_sync_relay:/data
      - dohc_self_host_relay_continuity:/continuity
      - dohc_self_host_host_data:/host-data
    healthcheck:
      test: [CMD, node, /app/tools/self-host/health.mjs, sync-relay]
      interval: 5s
      timeout: 5s
      retries: 20

  share-web:
    <<: *service
    command: [share-web]
    networks:
      dohc:
        ipv4_address: ${DOHC_SHARE_WEB_ADDRESS:-10.233.42.3}
    environment:
      NODE_ENV: production
      DOHC_SELF_HOST_LIVE: '1'
      DOHC_SHARE_WEB_RELAY_URL: http://sync-relay:1788
      DOHC_SHARE_WEB_AUTH_URL: http://workspace-api:1786
      DOHC_SHARE_WEB_PUBLIC_ORIGIN: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_SHARE_WEB_PUBLIC_RELAY_URL: ${DOHC_PUBLIC_ORIGIN:?Set DOHC_PUBLIC_ORIGIN}
      DOHC_SHARE_WEB_PUBLIC_HOSTS: ${DOHC_PUBLIC_HOST:?Set DOHC_PUBLIC_HOST}
      DOHC_SHARE_WEB_RELAY_EXCHANGE_KEY: ${DOHC_RELAY_EXCHANGE_KEY:?Run the self-host bootstrap to generate secrets}
      DOHC_SHARE_WEB_TRUSTED_PROXIES: ${DOHC_GATEWAY_ADDRESS:-10.233.42.2}
      DOHC_SHARE_WEB_APP_DOMAIN: ${DOHC_SHARE_WEB_APP_DOMAIN:-}
      DOHC_SHARE_WEB_BIND: 0.0.0.0
      DOHC_SHARE_WEB_PORT: '1790'
    depends_on:
      sync-relay: {condition: service_healthy}
      workspace-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /app/tools/self-host/health.mjs, share-web]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      DOHC_PUBLIC_HOST: ${DOHC_PUBLIC_HOST:?Set DOHC_PUBLIC_HOST}
    depends_on:
      workspace-api: {condition: service_healthy}
      sync-relay: {condition: service_healthy}
      share-web: {condition: service_healthy}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./tools/self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - dohc_self_host_tls:/data
      - dohc_self_host_gateway_config:/config
    networks:
      dohc:
        ipv4_address: ${DOHC_GATEWAY_ADDRESS:-10.233.42.2}

networks:
  dohc:
    ipam:
      config:
        - subnet: ${DOHC_NETWORK_SUBNET:-10.233.42.0/24}
          ip_range: ${DOHC_NETWORK_IP_RANGE:-10.233.42.128/25}

volumes:
  dohc_self_host_postgres:
  dohc_self_host_sync_relay:
  dohc_self_host_relay_continuity:
  dohc_self_host_host_data:
  dohc_self_host_tls:
  dohc_self_host_gateway_config:
