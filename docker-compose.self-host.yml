name: dohc-self-host

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dohc}
      POSTGRES_USER: ${POSTGRES_USER:-dohc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dohc} -d ${POSTGRES_DB:-dohc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - dohc_self_host_postgres:/var/lib/postgresql/data

  # Schema bootstrap: a one-shot init container that applies every Postgres
  # migration (idempotently) BEFORE the auth stack starts — notably
  # the Better Auth user/session/deviceCode schema that
  # workspace-api and sync-relay query. Without this, a fresh Postgres would
  # start the auth services against tables that do not exist yet. It exits 0 on
  # success; workspace-api and sync-relay gate on that completion.
  postgres-migrate:
    image: node:24-bookworm-slim
    working_dir: /workspace
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.20.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm migrate"
    volumes:
      - .:/workspace

  # Better Auth on /api/auth supports desktop device sign-in and mints the
  # bearer tokens that the sync relay validates. This service owns no
  # application routes.
  workspace-api:
    image: node:24-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.self-host}
      POSTGRES_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
      WORKSPACE_API_PORT: "1786"
      WORKSPACE_API_BASE_URL: ${WORKSPACE_API_BASE_URL:?Set WORKSPACE_API_BASE_URL in .env.self-host}
      DOHC_WEB_ORIGIN: ${DOHC_SHARE_WEB_PUBLIC_ORIGIN:?Set DOHC_SHARE_WEB_PUBLIC_ORIGIN in .env.self-host}
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.20.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/workspace-api dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1786/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    ports:
      - "${WORKSPACE_API_BIND:-127.0.0.1}:${WORKSPACE_API_PORT:-1786}:1786"
    volumes:
      - .:/workspace

  sync-relay:
    image: node:24-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      # Must match workspace-api exactly so Better Auth bearer tokens minted by
      # workspace-api's desktop device flow validate at the relay too.
      POSTGRES_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.self-host}
      DOHC_RELAY_LINK_KEY: ${DOHC_RELAY_LINK_KEY:?Set DOHC_RELAY_LINK_KEY in .env.self-host}
      DOHC_RELAY_EXCHANGE_KEY: ${DOHC_RELAY_EXCHANGE_KEY:?Set DOHC_RELAY_EXCHANGE_KEY in .env.self-host}
      DOHC_RELAY_APP_PUBLICATIONS: ${DOHC_RELAY_APP_PUBLICATIONS:-0}
      DOHC_RELAY_APP_COLLECTION_MAX_CREATES_PER_GRANT: ${DOHC_RELAY_APP_COLLECTION_MAX_CREATES_PER_GRANT:-0}
      DOHC_RELAY_SHARE_WEB_ORIGIN: ${DOHC_SHARE_WEB_PUBLIC_ORIGIN:?Set DOHC_SHARE_WEB_PUBLIC_ORIGIN in .env.self-host}
      SYNC_RELAY_BIND: "0.0.0.0"
      SYNC_RELAY_PORT: "1788"
      SYNC_RELAY_AUTH_BASE_URL: ${WORKSPACE_API_BASE_URL:?Set WORKSPACE_API_BASE_URL in .env.self-host}
      DOHC_RELAY_DEPLOYMENT_CONFIG: /continuity/deployment.json
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.20.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/sync-relay dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    ports:
      - "${SYNC_RELAY_BIND:-127.0.0.1}:${SYNC_RELAY_PORT:-1788}:1788"
    volumes:
      - .:/workspace
      - dohc_self_host_sync_relay:/data
      - dohc_self_host_relay_continuity:/continuity

  share-web:
    image: node:24-bookworm-slim
    working_dir: /workspace
    depends_on:
      sync-relay:
        condition: service_healthy
      workspace-api:
        condition: service_healthy
    environment:
      DOHC_SHARE_WEB_RELAY_URL: http://sync-relay:1788
      DOHC_SHARE_WEB_AUTH_URL: http://workspace-api:1786
      DOHC_SHARE_WEB_PUBLIC_ORIGIN: ${DOHC_SHARE_WEB_PUBLIC_ORIGIN:?Set DOHC_SHARE_WEB_PUBLIC_ORIGIN in .env.self-host}
      DOHC_SHARE_WEB_PUBLIC_RELAY_URL: ${DOHC_SHARE_WEB_PUBLIC_RELAY_URL:?Set DOHC_SHARE_WEB_PUBLIC_RELAY_URL in .env.self-host}
      DOHC_SHARE_WEB_RELAY_EXCHANGE_KEY: ${DOHC_RELAY_EXCHANGE_KEY:?Set DOHC_RELAY_EXCHANGE_KEY in .env.self-host}
      DOHC_SHARE_WEB_PUBLIC_HOSTS: ${DOHC_SHARE_WEB_PUBLIC_HOST:?Set DOHC_SHARE_WEB_PUBLIC_HOST in .env.self-host}
      DOHC_SHARE_WEB_APP_DOMAIN: ${DOHC_SHARE_WEB_APP_DOMAIN:-}
      DOHC_SHARE_WEB_TRUSTED_PROXIES: ${DOHC_SHARE_WEB_TRUSTED_PROXIES:-}
      DOHC_SHARE_WEB_BIND: "0.0.0.0"
      DOHC_SHARE_WEB_PORT: "1790"
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.20.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/share-web build &&
      pnpm --filter @dohc/share-web start"
    ports:
      - "${DOHC_SHARE_WEB_BIND:-127.0.0.1}:${DOHC_SHARE_WEB_PORT:-1790}:1790"
    volumes:
      - .:/workspace

volumes:
  dohc_self_host_postgres:
  dohc_self_host_sync_relay:
  dohc_self_host_relay_continuity:
