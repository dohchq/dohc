name: dohc-self-host

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dohc}
      POSTGRES_USER: ${POSTGRES_USER:-dohc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dohc} -d ${POSTGRES_DB:-dohc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - dohc_self_host_postgres:/var/lib/postgresql/data

  hocuspocus:
    build:
      context: .
      dockerfile: services/hocuspocus/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOCUSPOCUS_ADMIN_TOKEN: ${HOCUSPOCUS_ADMIN_TOKEN}
      HOCUSPOCUS_ALLOW_DEV_ACL: ${HOCUSPOCUS_ALLOW_DEV_ACL:-false}
      HOCUSPOCUS_DATABASE_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:?Set HOCUSPOCUS_JWT_SECRET in .env.self-host}
      HOCUSPOCUS_PORT: "1234"
      HOCUSPOCUS_QUIET: ${HOCUSPOCUS_QUIET:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:1234/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${HOCUSPOCUS_BIND:-127.0.0.1}:${HOCUSPOCUS_PORT:-1234}:1234"

  # Reduced to the collab + auth surface: Better Auth on /api/auth and the
  # collab-token route the desktop calls to join live co-editing. Needs the
  # SAME HOCUSPOCUS_JWT_SECRET hocuspocus verifies with; without it the collab
  # route fails closed (collab-disabled).
  workspace-api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.self-host}
      POSTGRES_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:?Set HOCUSPOCUS_JWT_SECRET in .env.self-host}
      WORKSPACE_API_PORT: "1786"
      WORKSPACE_API_BASE_URL: ${WORKSPACE_API_BASE_URL:-http://workspace-api:1786}
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.24.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/workspace-api dev"
    ports:
      - "${WORKSPACE_API_BIND:-127.0.0.1}:${WORKSPACE_API_PORT:-1786}:1786"
    volumes:
      - .:/workspace

  sync-relay:
    image: node:22-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Must match workspace-api exactly so Better Auth bearer tokens minted by
      # workspace-api's desktop device flow validate at the relay too.
      POSTGRES_URL: postgres://${POSTGRES_USER:-dohc}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.self-host}@postgres:5432/${POSTGRES_DB:-dohc}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.self-host}
      SYNC_RELAY_BIND: "0.0.0.0"
      SYNC_RELAY_PORT: "1788"
      SYNC_RELAY_DB_PATH: /data/sync-relay.sqlite
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.24.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/sync-relay dev"
    ports:
      - "${SYNC_RELAY_BIND:-127.0.0.1}:${SYNC_RELAY_PORT:-1788}:1788"
    volumes:
      - .:/workspace
      - dohc_self_host_sync_relay:/data

  sqlite-worker:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      SQLITE_WORKER_ALLOW_INSECURE_LOCAL: ${SQLITE_WORKER_ALLOW_INSECURE_LOCAL:-0}
      SQLITE_WORKER_PORT: "1787"
      SQLITE_WORKER_TOKEN: ${SQLITE_WORKER_TOKEN}
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.24.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/sqlite-worker dev"
    ports:
      - "${SQLITE_WORKER_BIND:-127.0.0.1}:${SQLITE_WORKER_PORT:-1787}:1787"
    volumes:
      - .:/workspace

  agent-sandbox:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      AGENT_SANDBOX_ROOT: /tmp/dohc-agent-sandbox
      SANDBOX_SAFE_PATH: /usr/local/bin:/usr/bin:/bin
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.24.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @dohc/agent-sandbox typecheck &&
      sleep infinity"
    volumes:
      - .:/workspace
      - dohc_self_host_agent_sandbox:/tmp/dohc-agent-sandbox

volumes:
  dohc_self_host_postgres:
  dohc_self_host_sync_relay:
  dohc_self_host_agent_sandbox:
