name: Think Bigger Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/superpowers/**'
      - 'scripts/check-think-bigger-doc-links.mjs'
      - '.github/workflows/think-bigger-docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/superpowers/**'
      - 'scripts/check-think-bigger-doc-links.mjs'
      - '.github/workflows/think-bigger-docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: think-bigger-docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: Link And Anchor Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter dohc install --frozen-lockfile --ignore-scripts

      - name: Check Think Bigger docs
        run: node scripts/check-think-bigger-doc-links.mjs
