name: Think Bigger Docs

on:
  pull_request:
    branches:
      - main
    paths: &think-bigger-doc-paths
      - 'docs/superpowers/**'
      - 'scripts/check-think-bigger-doc-links.mjs'
      - '.github/workflows/think-bigger-docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths: *think-bigger-doc-paths
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: think-bigger-docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: Link And Anchor Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pinned SHA
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Think Bigger docs
        run: node scripts/check-think-bigger-doc-links.mjs
