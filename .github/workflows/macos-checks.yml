name: macOS checks

# The Mac mini runner checks main every night. A maintainer can dispatch a
# check of any branch of this repository, such as a pull request's head branch.
# Pull requests never start this workflow, and it never uses Blacksmith.
# docs/engineering/macos-runner.md describes the runner and its trust model.
on:
  schedule:
    # 03:37 in UTC+8, the Mac's time zone.
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository to check. Leave empty to check the branch the workflow runs from.
        required: false
        type: string

# The single Mac runs one check at a time. GitHub keeps one pending run and
# cancels an older pending run, so nightly runs never queue behind each other.
concurrency:
  group: macos-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: full verification + desktop e2e
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 480
    env:
      DISPLAY_LOCK: /tmp/dohc-display.lock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Only a branch of this repository resolves under refs/heads/.
          # A fork's branch, a pull/<n>/head ref, or a commit SHA does not.
          ref: ${{ inputs.ref && format('refs/heads/{0}', inputs.ref) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # Keep ignored build output, such as target/ and node_modules/,
          # so a nightly run does not rebuild the engine from nothing.
          clean: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      # The verifier refuses untracked files. Evidence from an earlier run
      # would otherwise upload with this one.
      - name: Install dependencies
        run: |
          set -euo pipefail
          git clean -ffd
          rm -rf .agent-artifacts/verification
          pnpm install --frozen-lockfile

      - name: Check Docker
        run: |
          docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}' || {
            echo "::error::Docker does not respond. Start Colima on the Mac, then run the check again."
            exit 1
          }

      # Electron windows open on the Mac's only display. Wait until nobody has
      # used the keyboard or mouse for 15 minutes and no other process holds
      # the display lock. The lock names this job's Runner.Worker, so it goes
      # stale when the job ends however it ends.
      - name: Wait for the display
        id: display
        timeout-minutes: 180
        run: |
          set -euo pipefail
          worker=$PPID
          until [[ "$(ps -o comm= -p "$worker" || true)" == *Runner.Worker ]]; do
            worker=$(ps -o ppid= -p "$worker" | tr -d ' ' || true)
            if [[ -z "$worker" || "$worker" -le 1 ]]; then
              echo "::error::No Runner.Worker process owns this step."
              exit 1
            fi
          done
          echo "DISPLAY_LOCK_OWNER=$worker" >> "$GITHUB_ENV"
          while :; do
            idle=$(ioreg -c IOHIDSystem | awk '/HIDIdleTime/ && !seen { print int($NF / 1000000000); seen = 1 }')
            if [[ -z "$idle" ]]; then
              echo "::error::ioreg reported no keyboard or mouse idle time."
              exit 1
            fi
            if (( idle >= 900 )) && mkdir "$DISPLAY_LOCK" 2>/dev/null; then
              echo "$worker" > "$DISPLAY_LOCK/pid"
              echo "GitHub Actions run $GITHUB_RUN_ID at $(git rev-parse HEAD)" > "$DISPLAY_LOCK/what"
              echo "The Mac was idle for ${idle}s. This job holds the display."
              break
            fi
            holder=$(cat "$DISPLAY_LOCK/pid" 2>/dev/null || true)
            if [[ -n "$holder" ]] && ! kill -0 "$holder" 2>/dev/null; then
              rm -rf "$DISPLAY_LOCK"
              continue
            fi
            echo "Waiting for the display: idle ${idle}s, lock holder ${holder:-none}."
            sleep 60
          done

      # The same canonical gate as a pull request, in full mode: every gate,
      # package, repository test, and proof. It keeps going after a failure.
      - name: Full verification
        timeout-minutes: 150
        run: pnpm verify:pr --base HEAD --full

      # The whole desktop suite. A pull request's gate runs only its proofs.
      - name: Desktop e2e
        if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        timeout-minutes: 75
        run: pnpm test:desktop:e2e

      - name: Release the display
        if: always()
        run: |
          if [[ -n "${DISPLAY_LOCK_OWNER:-}" && "$(cat "$DISPLAY_LOCK/pid" 2>/dev/null)" == "$DISPLAY_LOCK_OWNER" ]]; then
            rm -rf "$DISPLAY_LOCK"
          fi

      # Traces, test workspaces, and profiles stay on the Mac until the next
      # run. They can contain document text.
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-verification-${{ github.run_attempt }}
          path: |
            .agent-artifacts/verification/*/result.json
            .agent-artifacts/verification/*/*.log
            .agent-artifacts/verification/*/playwright.json
            .agent-artifacts/verification/*/accounts-playwright.json
            .agent-artifacts/verification/*/js-tests/result.json
            .agent-artifacts/verification/*/js-tests/**/*.log
            .agent-artifacts/verification/*/ticket-evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
