name: macOS checks

# The self-hosted Mac runs the full gate and the desktop e2e suite on main every
# night. A maintainer can dispatch a check of any branch of this repository,
# such as a pull request's head branch. Pull requests never start this
# workflow, and it never uses Blacksmith. The runner is a dedicated macOS user
# that holds no secrets; docs/engineering/macos-runner.md describes its trust model.
on:
  schedule:
    # 03:37 in UTC+8, the Mac's time zone.
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository to check. Leave empty to check the branch the workflow runs from.
        required: false
        type: string

# The runner runs one check at a time. GitHub keeps one pending run and cancels
# an older pending run, so nightly runs never queue behind each other.
concurrency:
  group: macos-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: full verification + desktop e2e
    # Off until a maintainer sets the repository variable MACOS_RUNNER_ENABLED
    # to true, after the runner is registered (docs/engineering/macos-runner.md).
    # Evaluated before any runner is allocated.
    if: vars.MACOS_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, dohc-ci]
    timeout-minutes: 300
    env:
      # Only a branch resolves under refs/heads/. A fork's branch, a
      # pull/<n>/head ref, a tag, or a commit SHA does not.
      CHECK_REF: ${{ inputs.ref && format('refs/heads/{0}', inputs.ref) || github.ref }}
    steps:
      - name: Require a branch
        run: |
          if [[ "$CHECK_REF" != refs/heads/* ]]; then
            echo "::error::$CHECK_REF is not a branch. Dispatch the check from a branch, or name one in the ref input."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECK_REF }}
          fetch-depth: 0
          persist-credentials: false

      # Checkout already cleans a reused workspace. Repeat it so nothing an
      # earlier run left, including ignored build output, locks, and evidence,
      # reaches this run.
      - name: Remove earlier output
        id: clean
        run: git clean -ffdx

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The runner user's own Colima VM serves Docker. It does not share
      # another user's Docker socket.
      - name: Start Docker
        run: |
          set -euo pipefail
          colima status >/dev/null 2>&1 || colima start
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
          DOCKER_HOST="unix://$HOME/.colima/default/docker.sock" docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}'

      # The same canonical gate as a pull request, in full mode: every gate,
      # package, repository test, and proof. It keeps going after a failure.
      - name: Full verification
        timeout-minutes: 150
        run: pnpm verify:pr --base HEAD --full

      # The whole desktop suite. A pull request's gate runs only its proofs.
      - name: Desktop e2e
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 75
        run: pnpm test:desktop:e2e

      # Only this run's evidence: an earlier run's files exist until the clean
      # step. Traces, test workspaces, and profiles stay on the Mac until the
      # next run removes them. They can contain document text.
      - name: Verification evidence
        if: ${{ always() && steps.clean.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-verification-${{ github.run_attempt }}
          path: |
            .agent-artifacts/verification/*/result.json
            .agent-artifacts/verification/*/*.log
            .agent-artifacts/verification/*/playwright.json
            .agent-artifacts/verification/*/accounts-playwright.json
            .agent-artifacts/verification/*/js-tests/result.json
            .agent-artifacts/verification/*/js-tests/**/*.log
            .agent-artifacts/verification/*/ticket-evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
