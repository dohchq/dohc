# Builds the self-host image and its deployment bundle with tools/self-host/release.mjs, starts the bundle on this
# clean runner, and pushes the image to GHCR only when dry_run is off.
name: Self-host image

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and start the image without publishing it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: self-host-image
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dohchq/dohc-self-host:${{ github.sha }}
      ORIGIN: https://self-host-smoke.localhost
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      # The image build needs about 40 GB, and release.mjs refuses to start with less free.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          docker system prune --all --force
          df -h /
      - name: Build the image and bundle
        run: node tools/self-host/release.mjs --image "$IMAGE" --output "$RUNNER_TEMP/bundle"
      # Without public DNS and a trusted certificate, only the two public HTTPS checks may fail.
      - name: Start the bundle and check its health
        run: |
          cp -r "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          node tools/self-host/bootstrap.mjs init --origin "$ORIGIN" --image "$IMAGE"
          sed -i -e 's/^DOHC_SMTP_HOST=.*/DOHC_SMTP_HOST=smtp.invalid/' \
            -e 's/^DOHC_SMTP_FROM=.*/DOHC_SMTP_FROM=smoke@smtp.invalid/' .env.self-host
          node scripts/check-self-host.mjs --start | tee check.log || true
          for check in "compose startup" "ready service:workspace-api" "ready service:sync-relay" \
            "ready service:share-web" "server automations"; do
            grep -qx "\[ok\] $check" check.log || { echo "::error::Missing check: $check"; exit 1; }
          done
          if grep '^\[missing\]' check.log | grep -v -e '^\[missing\] public HTTPS connection and device approval' \
            -e '^\[missing\] native executable and relay HTTPS reachability'; then exit 1; fi
          curl -fsSk --retry 10 --retry-all-errors --resolve "${ORIGIN#https://}:443:127.0.0.1" \
            --output descriptor.json "$ORIGIN/.well-known/dohc-server"
          jq -e --arg origin "$ORIGIN" '.version == 1 and .authUrl == $origin and .relayUrl == $origin and .shareUrl == $origin' descriptor.json
      - name: Show service logs
        if: failure()
        working-directory: ${{ runner.temp }}/smoke
        run: docker compose --env-file .env.self-host -f docker-compose.self-host.yml logs --no-color --tail 200
      - name: Publish to GHCR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_IMAGE: ghcr.io/dohchq/dohc-self-host:latest
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" "$LATEST_IMAGE"
          docker push "$LATEST_IMAGE"
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          jq --arg image "$ref" '.image = $image' "$RUNNER_TEMP/bundle/release.json" > "$RUNNER_TEMP/release.json"
          mv "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/bundle/release.json"
          printf 'Published `%s` and `%s`\n' "$ref" "$LATEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-host-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
          include-hidden-files: true
          if-no-files-found: error
