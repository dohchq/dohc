name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for real defects. The PR branch is checked
            out in the current working directory; use `gh pr diff` / `gh pr view`
            for the change set and read surrounding source for context.

            Focus, in order:
            - Correctness bugs: concrete inputs or states that produce wrong
              behavior, data loss, or crashes. Pay extra attention to CRDT/sync
              ordering, transactionality, and async races.
            - Product invariants from AGENTS.md: server-side authorization,
              workspace scoping of every atom/folder/entity/share/capture,
              sandboxed HTML atoms, no new behavior depending on raw full-body
              markdown patching, and workspace-token guards on async renderer
              state.
            - Tests that assert nothing: skipped steps, frozen fixtures,
              tautological or vacuous assertions that would pass even if the
              feature were broken.
            - Security and performance regressions.

            Label every finding P1 (must fix before merge), P2 (should fix), or
            P3 (minor). Skip style nitpicks entirely; do not restate the diff.

            Be exhaustive: after you have posted your findings, make another
            full pass over the change set looking for issues you missed. Stop
            only when a complete pass turns up nothing new.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings tied to specific lines, and a single
            `gh pr comment` for the overall verdict. If a full review finds
            nothing, say so in one short comment. Only post GitHub comments —
            don't submit review text as plain messages.
          claude_args: |
            --model claude-fable-5
            --fallback-model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
