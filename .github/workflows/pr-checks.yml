# Cloud CI is out of budget. PR verification uses pnpm verify:pr locally.
# Keep dispatch-only; a manual run requires a registered local Linux x64 runner.
# The local verifier reads the path filters and tool pins below.
# Packaging, signing, and update manifests stay in Desktop Release.
name: PR checks

on:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_NEXTEST_VERSION: "0.9.143"

jobs:
  # Manual dispatch runs both jobs. The local verifier selects from these filters.
  changes:
    name: what changed
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # fuzz/ is a cargo workspace member the gate clippy/builds;
            # .cargo/ holds audit.toml, where advisory ignores would hide;
            # .gitignore decides what the gate's own tree-provenance readings
            # can see, so it is an input to the gate and not just to git --
            # ignoring a path removes it from every reading, and the gate tees
            # its log into the repo root.
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'fuzz/**'
              - 'fixtures/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'tools/rust-engine-program/**'
              - 'scripts/verification/**'
              - 'packages/ydoc-projection/**'
              # The live fixture oracles and dependency setup are Rust inputs.
              - 'packages/security-contract/**'
              - 'packages/workspace-contracts/**'
              - 'packages/workspace-core/**'
              - 'packages/workspace-engine-client/**'
              - 'packages/workspace-auth/**'
              - 'packages/service-http/**'
              # Native paired-backup proof invokes the production relay fixture.
              - 'services/sync-relay/**'
              - 'packages/live-session-contract/**'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.pnpmfile.cjs'
              - '.pnpmfile.mjs'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - '.gitignore'
              - '.github/workflows/pr-checks.yml'
            # services/ are pnpm workspace members (sync-relay, workspace-api
            # are live product); tsconfig.base.json is extended by every
            # package; Cargo files rebuild the daemon binary the desktop
            # e2e drives -- same rationale as crates/**; .gitignore is read by
            # scripts/rust-gate-artifact.test.mjs through git, which is how it
            # sees the probe file that test writes into the repo root, so an
            # ignore rule can disable that regression test silently.
            js:
              # Release helper tests validate packaging workflow behavior.
              - '.github/workflows/desktop-release.yml'
              # Source-backed example apps are compiled and staged by the desktop scripts.
              - 'examples/trip-poll/**'
              # The desktop daemon prebuild reads Cargo configuration.
              - '.cargo/**'
              - '.npmrc'
              - '.pnpmfile.cjs'
              - '.pnpmfile.mjs'
              - 'apps/**'
              - 'packages/**'
              - 'services/**'
              - 'crates/**'
              - 'vendor/**'
              - 'fuzz/**'
              - 'fixtures/**'
              - 'scripts/**'
              - 'tools/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.gitignore'
              - '.github/workflows/pr-checks.yml'

  javascript:
    name: typecheck + tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.js == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    # packages/workspace-auth exercises Better Auth against a REAL Postgres: it
    # applies the actual 0001_better_auth.sql migration and drives session and
    # authorization behaviour through it. Its suite self-skips when no database
    # is reachable, which is right for local dev and WRONG for CI -- a Postgres
    # that failed to start would silently skip the collab surface's
    # authorization tests and report green. So CI provides the database, and
    # DOHC_REQUIRE_POSTGRES makes an unreachable one a FAILURE rather than a skip.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dohc
          POSTGRES_PASSWORD: dohc
          POSTGRES_DB: dohc
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dohc -d dohc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOHC_REQUIRE_POSTGRES: "1"
      # Every daemon suite resolves the binary through
      # apps/desktop/src/testing/engineBinary, which finds the repo-root
      # target/debug build the step below produces. No per-suite binary
      # variable is needed; DOHC_REQUIRE_ENGINE_E2E turns a failed resolution
      # into a failure rather than a silent skip. Override with
      # DOHC_TEST_ENGINE_BINARY only to point at a binary somewhere else.
      DOHC_REQUIRE_ENGINE_E2E: "1"
      # The plugin install proofs run the real pinned pnpm against the real
      # registry. They are the only measured evidence behind the install
      # pins, so a checkout that cannot stage pnpm must fail here rather than
      # report those proofs green without running them.
      DOHC_REQUIRE_PLUGIN_INSTALL_E2E: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # package.json engines: >=24.14.0; "24" resolves to the latest 24.x
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      # Registry + ./target cache for the daemon debug build below. Keyed
      # separately from the engine gate's cache: the two jobs build different
      # subsets and would thrash a shared target cache.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: js-daemon

      - name: Fetch crate dependencies
        run: |
          set -euo pipefail
          cargo fetch --locked

      # The desktop capture e2e drives a REAL daemon over stdio; without this
      # binary it self-skips. It skipped on every platform since the day it was
      # written -- CI never built a debug daemon, and its path was hardcoded to
      # `.exe`, which Linux cannot match -- so the only end-to-end coverage of
      # the TypeScript desktop capture path never ran. When first forced to run
      # it failed, on a real defect (see #298). DOHC_REQUIRE_ENGINE_E2E turns a
      # missing binary here into a failure rather than a silent skip.
      - name: Build the engine daemon for the desktop e2e
        run: cargo build -p dohc-workspace-engine --bin dohc-workspace-engine

      # Runs every package, not just the one a PR touched. apps/site was broken
      # on main for weeks precisely because a red typecheck there read as noise
      # from whichever PR happened to be running.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Desktop system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Desktop boot and persistence
        run: xvfb-run -a pnpm qa:smoke

  rust:
    name: engine gate
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      # The gate's fixture-drift step regenerates the richdoc parity fixtures
      # through the LIVE TypeScript oracle, so it needs the JS workspace
      # installed. Without it that step reports SKIP rather than PASS -- which
      # is honest, but it would mean the drift check never actually runs in CI,
      # and drift going unnoticed is exactly what it exists to prevent.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: engine-gate

      # Prebuilt binaries, pinned so "cargo-deny=PASS" means the same thing
      # on every run.
      # The previous incarnation ran `cargo install` for both -- compiling the
      # two tools from source cost more minutes than the rest of the gate
      # combined. The verification steps below are what make the pin a checked
      # fact rather than an intention.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-nextest@0.9.143

      - name: Verify pinned cargo-deny
        run: |
          set -euo pipefail
          RESOLVED_CARGO_DENY_VERSION="$(cargo-deny --version)"
          if [ "$RESOLVED_CARGO_DENY_VERSION" != "cargo-deny $CARGO_DENY_VERSION" ]; then
            echo "::error::expected cargo-deny $CARGO_DENY_VERSION, got $RESOLVED_CARGO_DENY_VERSION"
            exit 1
          fi

      - name: Verify pinned cargo-nextest
        run: |
          set -euo pipefail
          RESOLVED_CARGO_NEXTEST_VERSION="$(cargo nextest --version | head -n 1 | awk '{print $2}')"
          if [ "$RESOLVED_CARGO_NEXTEST_VERSION" != "$CARGO_NEXTEST_VERSION" ]; then
            echo "::error::expected cargo-nextest $CARGO_NEXTEST_VERSION, got $RESOLVED_CARGO_NEXTEST_VERSION"
            exit 1
          fi

      # run-rust-checks PROBES for cargo-audit and degrades to SKIP when it is
      # absent -- honest, but it meant every PR reported "cargo-audit=SKIP"
      # beside a row of PASSes and no advisory scan ever ran in CI. That is
      # not hypothetical: the first run after this tool was actually installed
      # flagged a real DoS advisory that had been sitting on main.
      - name: Verify pinned cargo-audit
        run: |
          set -euo pipefail
          # `cargo audit --version` prints "cargo-audit-audit <version>" --
          # the cargo subcommand prefix is doubled -- so the version field is
          # compared rather than the whole line.
          RESOLVED_CARGO_AUDIT_VERSION="$(cargo audit --version | awk '{print $NF}')"
          if [ "$RESOLVED_CARGO_AUDIT_VERSION" != "$CARGO_AUDIT_VERSION" ]; then
            echo "::error::expected cargo-audit $CARGO_AUDIT_VERSION, got $RESOLVED_CARGO_AUDIT_VERSION"
            exit 1
          fi

      # The same script the program runs locally, so a green CI run and a green
      # local gate mean the same thing. Linux also compiles and runs the
      # cfg(unix) code the canonical Windows gate cannot see at all.
      - name: Canonical engine gate
        run: |
          set -euo pipefail
          node tools/rust-engine-program/run-rust-checks.mjs 2>&1 | tee pr-engine-gate.log
          node tools/rust-engine-program/require-ci-pass-verdict.mjs pr-engine-gate.log
