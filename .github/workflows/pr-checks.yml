# Blacksmith is off unless the repository variable BLACKSMITH_ENABLED is true.
# While off, only manual runs allocate runners, using local Linux x64 hosts.
# The local verifier reads the path filters and tool pins below.
# Packaging, signing, and update manifests stay in Desktop Release.
name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      gate:
        description: Full gate to run
        type: choice
        options: [all, js, rust]
        default: all
      runner_size:
        description: Blacksmith vCPUs, ignored while Blacksmith is off
        type: choice
        options: ["4", "8"]
        default: "4"

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_NEXTEST_VERSION: "0.9.143"

jobs:
  # Evaluate this condition before allocating any runner. Forks stay local-only.
  changes:
    name: what changed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.BLACKSMITH_ENABLED == 'true' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.BLACKSMITH_ENABLED == 'true' && '["blacksmith-2vcpu-ubuntu-2404"]' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Use the checked-out merge commit, just like the canonical verifier.
          # Local Git also avoids the PR files API's 3,000-file limit.
          token: ""
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            # .cargo/ holds audit.toml, where advisory ignores would hide;
            # .gitignore decides what the gate's own tree-provenance readings
            # can see, so it is an input to the gate and not just to git --
            # ignoring a path removes it from every reading, and the gate tees
            # its log into the repo root.
            rust:
              - 'crates/**'
              - 'vendor/**'
              - '.cargo/**'
              - '.config/nextest.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'tools/rust-engine-program/**'
              - 'scripts/verification/**'
              - 'packages/ydoc-projection/**'
              # The live fixture oracles and dependency setup are Rust inputs.
              - 'packages/security-contract/**'
              - 'packages/workspace-contracts/**'
              - 'packages/workspace-core/**'
              - 'packages/workspace-fs/text-media-cases.json'
              - 'packages/workspace-engine-client/**'
              - 'packages/workspace-auth/**'
              - 'packages/service-http/**'
              # Native paired-backup proof invokes the production relay fixture.
              - 'services/sync-relay/**'
              - 'packages/app-backend-runtime/**'
              - 'packages/live-session-contract/**'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.pnpmfile.cjs'
              - '.pnpmfile.mjs'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - '.gitignore'
              - '.github/workflows/pr-checks.yml'
            # services/ are pnpm workspace members (sync-relay, workspace-api
            # are live product); tsconfig.base.json is extended by every
            # package; Cargo files rebuild the daemon binary the desktop
            # e2e drives -- same rationale as crates/**; .gitignore is read by
            # scripts/rust-gate-artifact.test.mjs through git, which is how it
            # sees the probe file that test writes into the repo root, so an
            # ignore rule can disable that regression test silently.
            js:
              # Root inputs consumed by the self-host deployment tests and build context.
              - 'docker-compose.self-host.yml'
              - '.env.self-host.example'
              - '.dockerignore'
              # Release helper tests validate packaging workflow behavior.
              - '.github/workflows/desktop-release.yml'
              # packages/mcp's reference test compares this page with its generator.
              - 'docs/reference/cli-mcp-sdk.md'
              # Source-backed example apps are compiled and staged by the desktop scripts.
              - 'examples/trip-poll/**'
              - 'examples/fundraiser/**'
              - 'examples/stock-orders/**'
              # The desktop daemon prebuild reads Cargo configuration.
              - '.cargo/**'
              - '.npmrc'
              - '.pnpmfile.cjs'
              - '.pnpmfile.mjs'
              - 'apps/**'
              - 'packages/**'
              - 'services/**'
              - 'crates/**'
              - 'vendor/**'
              - 'scripts/**'
              - 'tools/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.gitignore'
              - '.github/workflows/pr-checks.yml'

  javascript:
    name: typecheck + tests
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.gate != 'rust') || needs.changes.outputs.js == 'true'
    runs-on: ${{ fromJSON(vars.BLACKSMITH_ENABLED == 'true' && format('["blacksmith-{0}vcpu-ubuntu-2404"]', inputs.runner_size == '8' && '8' || '4') || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      - name: Prepare the checkout
        run: pnpm setup:worktree

      # The jobs build different subsets, so keep their target caches separate.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: js-daemon

      # Install Xvfb before the runner starts the desktop proof's display.
      - name: Desktop system dependencies
        run: pnpm exec playwright install-deps chromium

      # The runner owns Postgres, native preparation, and every mandatory proof,
      # including accounts and self-host onboarding when selected.
      - name: Selected JavaScript gate
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: xvfb-run -a pnpm verify:pr --base "$PR_BASE_SHA" --job js

      - name: Full JavaScript gate
        if: github.event_name == 'workflow_dispatch'
        run: xvfb-run -a pnpm verify:pr --base HEAD --job js --full

      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-js-${{ github.run_attempt }}
          path: |
            .agent-artifacts/verification/*/result.json
            .agent-artifacts/verification/*/*.log
            .agent-artifacts/verification/*/js-tests/result.json
            .agent-artifacts/verification/*/js-tests/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: engine gate
    needs: changes
    if: (github.event_name == 'workflow_dispatch' && inputs.gate != 'js') || needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(vars.BLACKSMITH_ENABLED == 'true' && format('["blacksmith-{0}vcpu-ubuntu-2404"]', inputs.runner_size == '8' && '8' || '4') || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      # Rust fixture drift uses the live TypeScript oracle and pinned dependencies.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          cargo --version

      - name: Prepare the checkout
        run: pnpm setup:worktree

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: engine-gate

      # The canonical runner checks each installed version against the pins above.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-nextest@0.9.143

      # Linux also exercises cfg(unix) code absent from Windows verification.
      - name: Selected engine gate
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:pr --base "$PR_BASE_SHA" --job rust

      - name: Full engine gate
        if: github.event_name == 'workflow_dispatch'
        run: pnpm verify:pr --base HEAD --job rust --full

      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-rust-${{ github.run_attempt }}
          path: |
            .agent-artifacts/verification/*/result.json
            .agent-artifacts/verification/*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  verification:
    name: ${{ github.event_name == 'pull_request' && 'PR verification' || 'Manual verification' }}
    needs: [changes, javascript, rust]
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    runs-on: ${{ fromJSON(vars.BLACKSMITH_ENABLED == 'true' && '["blacksmith-2vcpu-ubuntu-2404"]' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Require every selected gate
        env:
          JOBS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GATE: ${{ inputs.gate || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const jobs = JSON.parse(process.env.JOBS);
          assert.equal(jobs.changes.result, 'success', 'Gate selection failed');
          for (const [gate, job] of [['js', 'javascript'], ['rust', 'rust']]) {
            if (process.env.EVENT_NAME === 'pull_request') {
              assert.ok(['true', 'false'].includes(jobs.changes.outputs[gate]), `${gate} selection is missing`);
            }
            const selected = process.env.EVENT_NAME === 'workflow_dispatch'
              ? process.env.REQUESTED_GATE === 'all' || process.env.REQUESTED_GATE === gate
              : jobs.changes.outputs[gate] === 'true';
            assert.equal(jobs[job].result, selected ? 'success' : 'skipped', `${gate} gate did not complete as selected`);
          }
          NODE
