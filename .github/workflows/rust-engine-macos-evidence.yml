# macOS evidence for the Rust engine rewrite (GATE6 / R15 cutover).
#
# The program's gates and soak ran on native Windows + WSL Linux. macOS is a
# shipping platform (apps/desktop), so this dispatchable workflow reproduces the
# full-workspace gate AND the cutoverBlocking soak on a macOS runner and uploads
# self-describing evidence artifacts (the run-rust-checks verdict log + the soak
# evidence JSON). Never runs automatically — dispatch it when macOS evidence is
# needed (GATE6 decision #2 / the R15 go/no-go).
#
# EVIDENCE INTEGRITY (why this file is fussy):
#   * `full` is the DEFAULT. The soak runner exits 0 for `--quick` with verdict
#     PASS-SCENARIOS-ONLY(trend-not-evaluated) — a green quick run is NOT the
#     cutoverBlocking evidence and must never be mistaken for it.
#   * cargo-deny is INSTALLED and a `cargo-deny=SKIP` gate line FAILS the run —
#     the canonical gate counts cargo-deny=PASS as part of the evidence.
#   * BOTH release binaries are built before the soak: the runner resolves the
#     daemon as a SIBLING `dohc-workspace-engine` in its own directory, so
#     `cargo run --bin dohc-soak-runner` alone would fail with a missing daemon.
name: rust-engine-macos-evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = the 30-60min cutoverBlocking soak (BANKABLE evidence). quick = short smoke, NON-GATING, cannot satisfy GATE6."
        type: choice
        default: full
        options: [full, quick]

concurrency:
  group: rust-engine-macos-evidence
  cancel-in-progress: false

jobs:
  macos-evidence:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cargo-deny (the gate counts cargo-deny=PASS as evidence)
        run: cargo install cargo-deny --locked

      - name: Full-workspace gate (fmt/clippy -D warnings/build/test/cargo-deny)
        run: |
          set -o pipefail
          node tools/rust-engine-program/run-rust-checks.mjs 2>&1 | tee macos-gate.log

      - name: Refuse a gate log that skipped cargo-deny
        run: |
          if grep -q "cargo-deny=SKIP" macos-gate.log; then
            echo "::error::macOS gate log has cargo-deny=SKIP — not valid GATE6 evidence."
            exit 1
          fi
          grep -E "run-rust-checks \| .* \| PASS \|" macos-gate.log

      - name: Build BOTH release binaries (soak resolves the daemon as a sibling)
        run: |
          cargo build --release --bin dohc-workspace-engine
          cargo build --release --features harness --bin dohc-soak-runner
          ls -l target/release/dohc-workspace-engine target/release/dohc-soak-runner

      - name: cutoverBlocking soak (self-describing evidence JSON)
        run: |
          set -o pipefail
          mkdir -p tools/rust-engine-program/soak-evidence
          OUT="tools/rust-engine-program/soak-evidence/macos-$(date -u +%Y-%m-%dT%H-%M-%SZ)-cutoverBlocking.json"
          if [ "${{ inputs.mode }}" = "full" ]; then
            ARGS="--minutes 30 --cycles 1000"
          else
            echo "::warning::quick mode is NON-GATING — it cannot satisfy the GATE6 cutoverBlocking evidence."
            ARGS="--quick"
          fi
          # Invoke the BUILT runner directly so its sibling-daemon resolution works.
          ./target/release/dohc-soak-runner $ARGS --evidence "$OUT" 2>&1 | tee macos-soak.log
          echo "MODE=${{ inputs.mode }}" >> macos-soak.log

      - name: Upload macOS evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-macos-evidence-${{ inputs.mode }}
          path: |
            macos-gate.log
            macos-soak.log
            tools/rust-engine-program/soak-evidence/macos-*.json
          if-no-files-found: warn
