# macOS evidence for the Rust engine rewrite (GATE6 / R15 cutover).
#
# The program's gates and soak ran on native Windows + WSL Linux. macOS is a
# shipping platform (apps/desktop), so this dispatchable workflow reproduces the
# full-workspace gate COMMAND on a macOS runner, where cfg-gated tests make the
# actual test set platform-dependent. It records the macOS test inventory/count
# and runs either the cutoverBlocking soak or a clearly labelled quick smoke.
# Never runs automatically — dispatch it when macOS evidence is needed (GATE6
# decision #2 / the R15 go/no-go).
#
# EVIDENCE INTEGRITY (why this file is fussy — a misleading artifact is worse than
# none when it feeds a cutover decision):
#   * `full` is the DEFAULT. The soak runner exits 0 for `--quick` with verdict
#     PASS-SCENARIOS-ONLY(trend-not-evaluated) — a green quick run is NOT the
#     cutoverBlocking evidence and must never be mistaken for it.
#   * Artifact names contain the final job status. A failed run can upload
#     diagnostics, but those diagnostics cannot share a green artifact's name.
#   * cargo-deny is installed at a PINNED version and a `cargo-deny=SKIP` gate line
#     FAILS the run — the canonical gate counts cargo-deny=PASS as evidence.
#   * BOTH release binaries are built before the soak: the runner resolves the
#     daemon as a SIBLING `dohc-workspace-engine` in its own directory, so
#     `cargo run --bin dohc-soak-runner` alone would fail with a missing daemon.
#   * An always-run validation requires this run's exact output path to contain
#     nonempty soak JSON. A green run therefore cannot exist without fresh
#     evidence, while previously banked JSON may remain in the checkout.
#   * The runner is PINNED to a macOS version, never `-latest`: evidence has to
#     name the OS it ran on.
#   * WHAT A macOS PASS DOES *NOT* PROVE (uncalibrated): the soak's handle and
#     thread tolerances (HANDLE_SLACK / THREAD_SLACK) were calibrated against
#     WINDOWS handle jitter. On macOS the counts come from `lsof` rows and
#     `ps -M` threads — materially different populations (mapped dylibs, sockets).
#     So a macOS PASS shows these Windows-derived bounds were met; it does NOT
#     establish that the bounds are meaningful here. The gate and scenario
#     results are citable; the resource-leak verdict is NOT bankable until the
#     tolerances are calibrated on representative Macs.
name: rust-engine-macos-evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = the 60-90min cutoverBlocking soak (BANKABLE evidence). quick = short smoke, NON-GATING, cannot satisfy GATE6."
        type: choice
        default: full
        options: [full, quick]
      soak_minutes:
        description: "Full-mode soak duration. Bounded so the 2x runner hard cap plus gate/build/drain fit the job timeout."
        type: choice
        default: "60"
        options:
          - "60"
          - "90"

permissions:
  contents: read

concurrency:
  group: rust-engine-macos-evidence-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Pinned so gate results cannot drift between runs; matches the version behind
  # the canonical Windows gate cited in GATE6_PACKET.md.
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  macos-evidence:
    name: macOS gate + ${{ inputs.mode == 'full' && 'cutoverBlocking soak' || 'quick smoke' }}
    # GitHub-hosted Apple Silicon (ARM64) — the architecture apps/desktop
    # actually ships on for Mac. Pinned to macos-15 rather than -latest so a
    # rolling OS bump cannot silently change what the cited evidence ran on.
    #
    # This was blacksmith-6vcpu-macos-15 (R15 decision #2) until Blacksmith was
    # dropped over its billing. NOTE BEFORE RE-ENABLING THIS WORKFLOW: this
    # repository is PRIVATE, and GitHub bills macOS minutes at a 10x
    # multiplier. A single full-mode run is a 60-90 minute soak, so it can
    # consume ~600-900 billable minutes. It is workflow_dispatch-only, but the
    # cost is real and deliberate, not incidental.
    runs-on: macos-15
    # The runner can use up to 2x the requested duration while satisfying both
    # its cycle and time targets. At the 90-minute maximum, 240 minutes leaves
    # 60 minutes for setup, the full gate, release builds, and idle drain.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Record source and runner provenance
        env:
          EVIDENCE_GITHUB_REF: ${{ github.ref }}
          EVIDENCE_GITHUB_SHA: ${{ github.sha }}
          EVIDENCE_RUNNER_NAME: ${{ runner.name }}
          EVIDENCE_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          MACHINE_ARCH="$(uname -m)"
          if [ "$MACHINE_ARCH" != "arm64" ]; then
            echo "::error::expected an arm64 macOS runner, got $MACHINE_ARCH"
            exit 1
          fi
          {
            printf 'github.sha=%s\n' "$EVIDENCE_GITHUB_SHA"
            printf 'github.ref=%s\n' "$EVIDENCE_GITHUB_REF"
            printf 'runner=%s os=%s\n' "$EVIDENCE_RUNNER_NAME" "$EVIDENCE_RUNNER_OS"
            printf 'uname.machine=%s\n' "$MACHINE_ARCH"
            sw_vers
            uname -a
          } | tee macos-toolversions.log

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          # A third-party runner image need not ship rustup the way GitHub's
          # macOS image does, so install it rather than assume it.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs               | sh -s -- -y --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV | tee -a macos-toolversions.log
          cargo --version | tee -a macos-toolversions.log

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # package.json engines: ^20.19.0 || ^22.13.0 || >=24.0.0
          node-version: "24"
          cache: pnpm

      # The gate's fixture-drift step resolves yjs/tsx from the JS workspace;
      # a required-step SKIP now fails the verdict, so the install is load-bearing.
      - name: Install JS workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned cargo-deny (the gate counts cargo-deny=PASS as evidence)
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --force --version "$CARGO_DENY_VERSION"
          RESOLVED_CARGO_DENY_VERSION="$(cargo-deny --version)"
          if [ "$RESOLVED_CARGO_DENY_VERSION" != "cargo-deny $CARGO_DENY_VERSION" ]; then
            echo "::error::expected cargo-deny $CARGO_DENY_VERSION, got $RESOLVED_CARGO_DENY_VERSION"
            exit 1
          fi
          printf '%s\n' "$RESOLVED_CARGO_DENY_VERSION" | tee -a macos-toolversions.log
          node --version | tee -a macos-toolversions.log

      - name: Full-workspace gate (fmt/clippy -D warnings/build/test/cargo-deny)
        run: |
          set -o pipefail
          node tools/rust-engine-program/run-rust-checks.mjs 2>&1 | tee macos-gate.log

      - name: Record the platform-dependent macOS test inventory
        run: |
          set -euo pipefail
          cargo test --workspace -- --list --format terse 2>&1 | tee macos-test-list.log
          TEST_COUNT="$(grep -Ec ': test$' macos-test-list.log || true)"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "::error::cargo reported zero macOS workspace tests"
            exit 1
          fi
          printf 'test --workspace count=%s (platform-dependent macOS set)\n' "$TEST_COUNT" \
            | tee -a macos-gate.log

      - name: Require a canonical PASS verdict with cargo-deny actually run
        run: |
          if grep -q "cargo-deny=SKIP" macos-gate.log; then
            echo "::error::macOS gate log has cargo-deny=SKIP — not valid GATE6 evidence."
            exit 1
          fi
          grep -E "run-rust-checks \| .* \| PASS \|" macos-gate.log \
            || { echo "::error::no PASS verdict line in the macOS gate log."; exit 1; }

      - name: Build BOTH release binaries (soak resolves the daemon as a sibling)
        run: |
          cargo build --release --bin dohc-workspace-engine
          cargo build --release --features harness --bin dohc-soak-runner
          ls -l target/release/dohc-workspace-engine target/release/dohc-soak-runner

      - name: Soak (${{ inputs.mode }} mode; self-describing evidence JSON)
        env:
          SOAK_MODE: ${{ inputs.mode }}
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: |
          set -euo pipefail
          mkdir -p tools/rust-engine-program/soak-evidence
          if [ "$SOAK_MODE" = "full" ]; then
            EVIDENCE_TIER="cutoverBlocking"
            case "$SOAK_MINUTES" in
              60|90) ;;
              *)
                echo "::error::full-mode soak_minutes must be 60 or 90; got '$SOAK_MINUTES'"
                exit 1
                ;;
            esac
            ARGS="--minutes $SOAK_MINUTES --cycles 1000"
          else
            EVIDENCE_TIER="quick-smoke"
            echo "::warning::quick mode is NON-GATING — it cannot satisfy the GATE6 cutoverBlocking evidence."
            ARGS="--quick"
          fi
          OUT="tools/rust-engine-program/soak-evidence/macos-$(date -u +%Y-%m-%dT%H-%M-%SZ)-${EVIDENCE_TIER}.json"
          test ! -e "$OUT" || { echo "::error::refusing to overwrite existing evidence JSON at $OUT"; exit 1; }
          printf 'SOAK_EVIDENCE_PATH=%s\n' "$OUT" >> "$GITHUB_ENV"
          echo "::warning::macOS handle/thread slack bounds are UNCALIBRATED for lsof/ps -M counters; see processSampling in the evidence JSON."
          # Invoke the BUILT runner directly so its sibling-daemon resolution works.
          ./target/release/dohc-soak-runner $ARGS --evidence "$OUT" 2>&1 | tee macos-soak.log
          echo "MODE=$SOAK_MODE" >> macos-soak.log
          test -s "$OUT" || { echo "::error::soak produced no evidence JSON at $OUT"; exit 1; }

      - name: Require this run's nonempty soak evidence JSON
        if: always()
        run: |
          if [ -z "${SOAK_EVIDENCE_PATH:-}" ]; then
            echo "::error::soak step did not record this run's evidence path"
            exit 1
          fi
          if [ ! -s "$SOAK_EVIDENCE_PATH" ]; then
            echo "::error::this run's soak evidence JSON is missing or empty: $SOAK_EVIDENCE_PATH"
            exit 1
          fi

      - name: Print the RSS trend shape and idle-drain result
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${SOAK_EVIDENCE_PATH:-}" ] || [ ! -s "$SOAK_EVIDENCE_PATH" ]; then
            echo "no evidence json to summarize"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const s = d.samples || [];
            const mb = (x) => (x / 1e6).toFixed(1);
            console.log(
              "RSS TREND FITS: whole-run=" +
                Math.round(d.rssSlopeBytesPerSecWholeRun) +
                " B/s tail=" +
                Math.round(d.rssSlopeBytesPerSecTail) +
                " B/s (" +
                d.trendTailSamples +
                " samples / " +
                Math.round(d.trendFitSpanSecsTail) +
                "s)"
            );
            if (s.length < 8) {
              console.log("too few samples to shape-check: " + s.length);
            } else {
              console.log("RSS TREND SHAPE (informational per-quarter least-squares fits):");
              d.workloadTrendByQuarter.forEach((quarter, i) => {
                const cycleRate = quarter.cycleRatePerSec == null
                  ? "n/a"
                  : quarter.cycleRatePerSec.toFixed(3);
                const bytesPerCycle = quarter.rssSlopeBytesPerCycle == null
                  ? "n/a"
                  : Math.round(quarter.rssSlopeBytesPerCycle);
                console.log(
                  "  quarter " +
                    (i + 1) +
                    ": rss=" +
                    Math.round(quarter.rssSlopeBytesPerSec) +
                    " B/s workload=" +
                    cycleRate +
                    " cycles/s normalized=" +
                    bytesPerCycle +
                    " B/cycle cycles=" +
                    quarter.cyclesCompletedStart +
                    "->" +
                    quarter.cyclesCompletedEnd
                );
              });
              console.log("  rss first=" + mb(s[0].rss_bytes) + "MB last=" + mb(s[s.length - 1].rss_bytes) + "MB peak=" + mb(Math.max.apply(null, s.map((x) => x.rss_bytes))) + "MB samples=" + s.length);
              console.log("  handles " + s[0].handles + "->" + s[s.length - 1].handles + " threads " + s[0].threads + "->" + s[s.length - 1].threads);
            }
            const drain = d.drain;
            if (!drain) {
              console.log("IDLE DRAIN: missing from evidence");
            } else {
              const dropPercent = drain.rssDropPercentOfRunGrowth == null
                ? "n/a (no positive run growth)"
                : drain.rssDropPercentOfRunGrowth.toFixed(1) + "% of run growth";
              console.log("IDLE DRAIN (" + drain.windowSecs + "s, unaided): " + drain.drainDisposition);
              console.log("  rss start=" + mb(drain.rssAtStartBytes) + "MB end=" + mb(drain.rssAtEndBytes) + "MB min=" + mb(drain.rssMinBytes) + "MB drop=" + mb(drain.rssDropBytes) + "MB (" + dropPercent + ")");
              console.log("  samples=" + drain.samplesCollected + " allocatorReleaseRequested=" + drain.allocatorReleaseRequested);
            }
            console.log("RSS DISPOSITION (final-half B/s threshold): " + d.rssDisposition);
            console.log("WARMUP-DOMINATED WHOLE-RUN FIT: " + d.warmupDominatedWholeRunFit);
            console.log("RUN VERDICT: " + d.verdict);
          ' "$SOAK_EVIDENCE_PATH"

      # The artifact quota is account-wide, so uploads can fail for reasons this
      # repo cannot fix -- and every macOS run so far has hit exactly that,
      # leaving the evidence produced but unbanked. Emit the JSON into the run's
      # own durable record BEFORE attempting the upload, so a quota failure
      # costs convenience rather than the evidence itself.
      - name: Bank the evidence JSON in the run record
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${SOAK_EVIDENCE_PATH:-}" ] || [ ! -s "$SOAK_EVIDENCE_PATH" ]; then
            echo "no evidence json to bank"
            exit 0
          fi
          {
            echo "### macOS soak evidence — \`$SOAK_EVIDENCE_PATH\`"
            echo
            echo "Commit this to \`tools/rust-engine-program/soak-evidence/\` to bank it."
            echo
            echo '```json'
            cat "$SOAK_EVIDENCE_PATH"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- BEGIN SOAK EVIDENCE JSON ---"
          cat "$SOAK_EVIDENCE_PATH"
          echo
          echo "--- END SOAK EVIDENCE JSON ---"

      - name: Upload macOS evidence artifacts
        if: always()
        # The evidence is already in the step summary and the log by now, so a
        # quota failure here costs convenience, not evidence. Without this the
        # whole run reports failure even when the gate and soak both passed --
        # which is exactly how ten macOS runs came to be recorded as failures.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-engine-macos-evidence-${{ inputs.mode }}-${{ job.status }}
          path: |
            macos-gate.log
            macos-soak.log
            macos-test-list.log
            macos-toolversions.log
            ${{ env.SOAK_EVIDENCE_PATH }}
          # The always-run validation above, not this multi-path option, makes
          # the JSON mandatory for a green run.
          if-no-files-found: error
