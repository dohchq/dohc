# Deploys the marketing site to Cloudflare after a change on main reaches it.
# The site's demo builds from the desktop renderer and shared packages, so
# changes there deploy it too. Deploys run only while the repository variable
# SITE_DEPLOY_ENABLED is true. The site environment holds the Cloudflare
# token and account ID.
name: Site deploy

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/desktop/src/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/site-deploy.yml
  workflow_dispatch:

# A newer push waits for the running deploy, then deploys the newest main.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.151.3"

jobs:
  deploy:
    name: deploy site
    if: vars.SITE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: site
    runs-on: ${{ fromJSON(vars.BLACKSMITH_ENABLED == 'true' && '["blacksmith-2vcpu-ubuntu-2404"]' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The site builds desktop sources, not the Electron app.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Test and build the site
        run: |
          pnpm --filter @dohc/site test
          pnpm --filter @dohc/site build

      - name: Deploy
        working-directory: apps/site
        run: pnpm dlx "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
