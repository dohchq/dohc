name: Desktop Release
# The scheduled nightly job finds its run by the commit it requested.
run-name: Desktop Release ${{ inputs.channel }}${{ inputs.dry_run && ' dry run' || '' }}${{ inputs.commit && format(' for {0}', inputs.commit) || '' }}

# Releases start only by dispatch and build Windows and Linux on pinned
# GitHub-hosted images. The scheduled nightly dispatches the same workflow.
# The release owner adds the macOS files to the published release with
# `pnpm release:macos` on a Mac (docs/engineering/desktop-release.md).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - latest
          - nightly
      version:
        description: Stable version, for example 0.1.0 or v0.1.0
        required: false
        type: string
      platforms:
        description: Platforms to build. A published nightly needs windows-linux.
        required: true
        default: windows-linux
        type: choice
        options:
          - windows
          - linux
          - windows-linux
      dry_run:
        description: Build and test without publishing artifacts
        required: true
        default: true
        type: boolean
      commit:
        description: Build only if main is at this commit. The scheduled nightly job sets it.
        required: false
        type: string

# A second dispatch on a channel waits. Cancelling a publish in progress
# could leave a release with only some of its files.
concurrency:
  group: desktop-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.platforms == 'linux' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 90
    outputs:
      release_channel: ${{ steps.release.outputs.release_channel }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      dry_run: ${{ inputs.dry_run }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      # The scheduled nightly job requests the commit its verification passed.
      # If main moved since, nothing builds or publishes.
      - name: Check the requested commit
        if: inputs.commit != ''
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ "$REQUESTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::main is at $GITHUB_SHA, not the requested commit $REQUESTED_COMMIT. Nothing builds."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      # GitHub's images carry only the newest stable Rust, and the build checks
      # rust-toolchain.toml's version without installing it.
      - name: Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      # GitHub's Windows image sets TEMP to a short 8.3 path (RUNNER~1), and
      # tests compare it with the long path dohc resolves it to.
      - name: Use the runner's temp folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - id: release
        name: Resolve release metadata
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          version_arg=()
          if [[ -n "${DISPATCH_VERSION:-}" ]]; then
            version_arg=(--version "${DISPATCH_VERSION}")
          fi

          nightly_date="$(date -u +%Y%m%d)"
          node scripts/resolve-desktop-release.mjs \
            --channel "$DISPATCH_CHANNEL" \
            --platforms "$DISPATCH_PLATFORMS" \
            "${version_arg[@]}" \
            --date "$nightly_date" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$GITHUB_SHA" \
            --github-output

      - name: Stamp desktop package version
        env:
          DESKTOP_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/update-desktop-package-version.mjs

      - name: Release helper tests
        run: pnpm test:release:desktop

      - name: Desktop release smoke
        run: pnpm smoke:release:desktop

      - name: Prepare desktop test runtime
        run: pnpm --filter @dohc/app-backend-runtime build

      - name: Prepare native test engine
        run: pnpm qa:prepare -- --engine-only

      - name: Desktop typecheck
        run: pnpm --filter @dohc/desktop typecheck

      # The desktop package's unit and script tests run through the PR gate's
      # runner, with its rules. A test that fails runs once more, and a test
      # that fails both tries must pass when its file runs alone.
      - name: Desktop tests
        env:
          DOHC_REQUIRE_ENGINE_E2E: "1"
        run: node scripts/verification/js-tests.mjs --prepared --package @dohc/desktop

  # The release action reuses an existing release with the same tag, published
  # or draft, and turns it back into a draft while it uploads. A dispatch must
  # therefore use a version that has no tag and no release. This is its own job
  # because only a token with push access lists draft releases, and preflight
  # runs pnpm install.
  unused-version:
    name: Check release publication
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      # Publish checks these rules again, because a run can publish after
      # midnight UTC or be re-run.
      - name: Check publication rules
        if: needs.preflight.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | {draft, tag_name, published_at, assets: [.assets[] | {name}]}' > release-history.jsonl
          node scripts/check-desktop-release-publication.mjs \
            --channel "$RELEASE_CHANNEL" \
            --platforms "$RELEASE_PLATFORMS" \
            --releases release-history.jsonl

      - name: Refuse a version that has a tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # Both queries list matches, so an API failure stops the job
          # instead of reading as "unused".
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')"
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" \
            --jq '.[] | select(.ref == "refs/tags/" + env.TAG) | .ref')"
          if [[ "$releases" == *published* ]]; then
            echo "::error::Version ${VERSION} is already published as ${TAG}. Bump the version, then dispatch again."
            exit 1
          fi
          if [[ "$releases" == *draft* ]]; then
            echo "::error::Version ${VERSION} has a draft release, ${TAG}, left by an earlier run. Delete that draft or bump the version, then dispatch again."
            exit 1
          fi
          if [[ -n "$tag" ]]; then
            echo "::error::Version ${VERSION} already has the tag ${TAG}. Bump the version, then dispatch again."
            exit 1
          fi
          echo "Version ${VERSION} has no tag or release."

  build:
    name: Package ${{ matrix.label }}
    needs:
      - preflight
      - unused-version
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      # GitHub's images carry only the newest stable Rust, and the build checks
      # rust-toolchain.toml's version without installing it.
      - name: Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      # GitHub's Windows image sets TEMP to a short 8.3 path (RUNNER~1), and
      # tests compare it with the long path dohc resolves it to.
      - name: Use the runner's temp folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Stamp desktop package version
        env:
          DESKTOP_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-desktop-package-version.mjs

      # The PostHog project is a repository variable, not a secret: the key
      # ships inside the app. A dry run builds an app that sends nothing.
      - name: Build desktop
        env:
          DOHC_POSTHOG_KEY: ${{ needs.preflight.outputs.dry_run != 'true' && vars.DOHC_POSTHOG_KEY || '' }}
          DOHC_POSTHOG_HOST: ${{ needs.preflight.outputs.dry_run != 'true' && vars.DOHC_POSTHOG_HOST || '' }}
          DOHC_DESKTOP_DIST: ${{ matrix.artifact_platform }}-${{ matrix.arch }}
        run: pnpm build:desktop

      # Error reports name frames in the minified files. This step writes a
      # chunk ID into each file and uploads its source map, which the
      # installer leaves out, so PostHog can show the original lines. The
      # package ships the files with those IDs. A build with a PostHog key
      # fails here if the upload cannot run. A dry run only installs and runs
      # the CLI.
      - name: Upload source maps
        env:
          DOHC_SOURCE_MAPS_DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          DOHC_POSTHOG_KEY: ${{ needs.preflight.outputs.dry_run != 'true' && vars.DOHC_POSTHOG_KEY || '' }}
          DOHC_DESKTOP_DIST: ${{ matrix.artifact_platform }}-${{ matrix.arch }}
          DESKTOP_VERSION: ${{ needs.preflight.outputs.version }}
          POSTHOG_CLI_API_KEY: ${{ needs.preflight.outputs.dry_run != 'true' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
        run: node scripts/upload-desktop-source-maps.mjs

      - name: Build workspace engine
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          pnpm --filter @dohc/desktop run build:engine --target "${{ matrix.target }}"

      - id: signing
        name: Resolve signing mode
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          OS_NAME: ${{ matrix.os }}
          REQUIRE_SIGNING: ${{ matrix.require_signing }}
          WIN_CSC_LINK: ${{ needs.preflight.outputs.dry_run != 'true' && matrix.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
        run: |
          set -euo pipefail
          require=0
          has_credentials=0
          if [[ "$OS_NAME" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            has_credentials=1
          elif [[ "$REQUIRE_SIGNING" != "1" ]]; then
            has_credentials=1
          fi

          if [[ "$DRY_RUN" == "true" || "$REQUIRE_SIGNING" != "1" ]]; then
            require=0
          elif [[ "$RELEASE_CHANNEL" == "latest" ]]; then
            require=1
          elif [[ "$has_credentials" == "1" ]]; then
            require=1
          else
            echo "::warning::Signing credentials are not configured; building unsigned nightly ${OS_NAME} artifacts."
          fi

          echo "require=$require" >> "$GITHUB_OUTPUT"

      # Only Windows steps receive signing secrets.
      - name: Package smoke
        env:
          DOHC_REQUIRE_SIGNING: ${{ steps.signing.outputs.require }}
          WIN_CSC_LINK: ${{ needs.preflight.outputs.dry_run != 'true' && matrix.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
        run: pnpm smoke:package:desktop

      - name: Package desktop
        shell: bash
        env:
          DOHC_REQUIRE_SIGNING: ${{ steps.signing.outputs.require }}
          WIN_CSC_LINK: ${{ needs.preflight.outputs.dry_run != 'true' && matrix.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ needs.preflight.outputs.dry_run != 'true' && matrix.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          builder_args=(--publish never "-c.publish.channel=${{ needs.preflight.outputs.release_channel }}" "--${{ matrix.arch }}")
          if [[ "$DOHC_REQUIRE_SIGNING" == "1" ]]; then
            builder_args+=(-c.forceCodeSigning=true)
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm --filter @dohc/desktop exec electron-builder "${builder_args[@]}"

      - name: Verify release artifacts
        shell: bash
        run: |
          node scripts/verify-desktop-release-artifacts.mjs \
            --directory apps/desktop/release \
            --platform "${{ matrix.artifact_platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --channel "${{ needs.preflight.outputs.release_channel }}"

      - name: Fuse smoke
        if: runner.os == 'Linux'
        env:
          DOHC_E2E_NO_CHROMIUM_SANDBOX: "1"
        run: xvfb-run -a pnpm smoke:fuses:desktop

      # A workspace the newest published nightly wrote must open under this
      # package's engine with its files and history intact. It runs on every
      # nightly, so a new engine migration never ships unchecked.
      - id: previous-nightly
        name: Choose the previous nightly
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, published_at, assets: [.assets[] | {name}]}' > "${RUNNER_TEMP}/nightly-history.jsonl"
          node scripts/select-upgrade-nightly.mjs --releases "${RUNNER_TEMP}/nightly-history.jsonl" --github-output

      - name: Engine upgrade check
        if: runner.os == 'Linux' && steps.previous-nightly.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NIGHTLY: ${{ steps.previous-nightly.outputs.tag }}
          DOHC_TEST_ENGINE_BINARY: ${{ github.workspace }}/apps/desktop/release/linux-unpacked/resources/workspace-engine/dohc-workspace-engine
          DOHC_REQUIRE_UPGRADE_E2E: "1"
        run: |
          set -euo pipefail
          # Outside apps/desktop/release, so the upload never includes it.
          download="${RUNNER_TEMP}/previous-nightly"
          rm -rf "$download"
          mkdir "$download"
          gh release download "$PREVIOUS_NIGHTLY" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir "$download"
          appimages=("$download"/*.AppImage)
          (( ${#appimages[@]} == 1 )) || { echo "::error::${PREVIOUS_NIGHTLY} has ${#appimages[@]} AppImages; expected one."; exit 1; }
          chmod +x "${appimages[0]}"
          (cd "$download" && "${appimages[0]}" --appimage-extract > /dev/null)
          export DOHC_UPGRADE_PREVIOUS_ENGINE="$download/squashfs-root/resources/workspace-engine/dohc-workspace-engine"
          if [[ ! -x "$DOHC_UPGRADE_PREVIOUS_ENGINE" ]]; then
            echo "::error::${PREVIOUS_NIGHTLY}'s AppImage has no executable engine at resources/workspace-engine/dohc-workspace-engine."
            exit 1
          fi
          echo "Opening a workspace from ${PREVIOUS_NIGHTLY} with this package's engine."
          pnpm --filter @dohc/desktop exec vitest run src/workspaces/engineUpgrade.e2e.test.ts

      - name: Windows packaged smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node tools/perf-profiling/packaged-benchmark.mjs `
            --binary apps/desktop/release/win-unpacked/dohc.exe `
            --package-commit '${{ github.sha }}' `
            --output .agent-artifacts/release-package-smoke `
            --label candidate --runs 1 --idle-seconds 1 --keystrokes 5 --switches 1

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    environment: desktop-release
    needs:
      - preflight
      - build
    if: ${{ needs.preflight.outputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Required for creating GitHub releases via softprops/action-gh-release.
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      # This job holds the channel's concurrency lock, so no other release on
      # the channel can publish between this check and the publish step.
      - name: Check publication rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | {draft, tag_name, published_at, assets: [.assets[] | {name}]}' > release-history.jsonl
          node scripts/check-desktop-release-publication.mjs \
            --channel "$RELEASE_CHANNEL" \
            --platforms "$RELEASE_PLATFORMS" \
            --releases release-history.jsonl

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Prepare release upload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          channel="${{ needs.preflight.outputs.release_channel }}"
          unexpected_channel="nightly"
          if [[ "$channel" == "nightly" ]]; then
            unexpected_channel="latest"
          fi
          rm -rf release-upload
          mkdir -p release-upload

          copy_unique() {
            local source="$1"
            local target="release-upload/$(basename "$source")"
            if [[ -f "$target" ]] && ! cmp -s "$source" "$target"; then
              echo "Conflicting release artifact basename: $(basename "$source")"
              exit 1
            fi
            cp "$source" "$target"
          }

          is_release_upload_file() {
            local source="$1"
            local name
            name="$(basename "$source")"
            case "$source" in
              */win-unpacked/*|*/linux-unpacked/*)
                return 1
                ;;
            esac
            case "$name" in
              latest*.yml|nightly*.yml|*.exe|*.AppImage|*.deb|*.blockmap)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          while IFS= read -r -d '' file; do
            if ! is_release_upload_file "$file"; then
              continue
            fi
            copy_unique "$file"
          done < <(find release-artifacts -type f -print0)

          expected_manifests=(release-upload/"$channel"*.yml)
          if (( ${#expected_manifests[@]} == 0 )); then
            echo "No $channel update manifests were produced."
            exit 1
          fi
          unexpected_manifests=(release-upload/"$unexpected_channel"*.yml)
          if (( ${#unexpected_manifests[@]} > 0 )); then
            printf 'Unexpected %s manifests in %s release:\n' "$unexpected_channel" "$channel"
            printf '  %s\n' "${unexpected_manifests[@]}"
            exit 1
          fi

      # Updaters never see a draft. The release stays a draft until every file
      # is uploaded, so a run that stops early leaves nothing an app can fetch.
      - name: Create draft GitHub release
        id: draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.release_name }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.make_latest == 'true' }}
          files: release-upload/**

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest="${MAKE_LATEST}" \
            --jq '"Published \(.tag_name) at \(.html_url)"'
