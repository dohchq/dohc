# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Be concise and direct. Prioritize correctness, data durability, workspace isolation, authorization, tests, and obvious UX."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    State the user-facing outcome first. Then name the changed subsystems,
    material risks, and verification evidence.
  auto_title_instructions: |
    Use a short imperative title.
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/.output/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/target/**"
    - "!**/*.tsbuildinfo"

  labeling_instructions:
    - label: "security"
      instructions: "Authorization, workspace isolation, sharing, secrets, path containment, sandboxing, or dependency security."
    - label: "engine"
      instructions: "Rust engine, daemon protocol, storage, capture, history, versions, search, chats, or engine clients."
    - label: "desktop"
      instructions: "Electron main, preload, IPC, lifecycle, packaging, updates, or desktop settings."
    - label: "frontend"
      instructions: "React renderer, editor, workbench, styles, accessibility, or client state."
    - label: "collab"
      instructions: "Yjs, document sessions, sync relay, sharing, presence, reactions, channels, or direct messages."
    - label: "brand"
      instructions: "Brand package, logos, tokens, social assets, design system, or identity guard changes."
    - label: "docs"
      instructions: "Product, architecture, development, security, QA, or agent documentation."
    - label: "tests"
      instructions: "Vitest, Node test runner, Cargo tests, Playwright, fixtures, or test helpers."
    - label: "dependencies"
      instructions: "Package manifests, lockfiles, workspace boundaries, toolchains, or dependency versions."
    - label: "infra"
      instructions: "Docker, environment examples, scripts, workflows, releases, or runtime configuration."

  path_instructions:
    - path: "**/*"
      instructions: |
        Review dohc as a pre-launch local-first workspace. Focus on correctness,
        data durability, workspace isolation, authorization, review gates, and
        maintainability. Avoid style-only comments.
    - path: "crates/**"
      instructions: |
        Treat storage, capture, sync, secrets, and protocol changes as
        data-integrity work. Preserve workspace-handle scoping, cancellation
        safety, deterministic ordering, transaction boundaries, and the
        workspace unsafe-code prohibition. Ask for regression tests at the
        owning Rust boundary.
    - path: "packages/workspace-engine-client/**"
      instructions: |
        Keep daemon framing, request cancellation, restart recovery, event
        generations, and wire decoders aligned with the Rust protocol. Flag
        client assumptions that widen daemon authority or hide refusal errors.
    - path: "apps/desktop/src/main.ts"
      instructions: |
        Main is the renderer trust boundary. Verify every IPC sender, parse
        every payload, resolve workspace and actor context in main, and keep
        daemon lifecycle failures visible.
    - path: "apps/desktop/src/renderer/**"
      instructions: |
        Review workspace-scoped asynchronous state for stale-response races.
        Check keyboard access, focus, loading states, and clear recovery paths.
        Renderer state never grants authorization.
    - path: "apps/desktop/src/renderer/editor/**"
      instructions: |
        A live Y.Doc session is canonical. Settlement writes the Markdown
        artifact through the engine. Check deterministic import and export,
        session teardown, remote updates, and no silent save failures.
    - path: "services/sync-relay/**"
      instructions: |
        Derive identity from the validated Better Auth session. Preserve
        workspace ownership, positive share filters, byte-identical denials,
        cursor and acknowledgement safety, secret exclusion, and ephemeral
        presence.
    - path: "services/workspace-api/**"
      instructions: |
        The workspace API serves Better Auth only. Flag new application routes,
        caller-supplied identity, permissive CORS, or configuration that lets
        the API and relay validate different sessions.
    - path: "packages/workspace-postgres/**"
      instructions: |
        Postgres stores Better Auth data only. Flag application tables or
        migrations that restore a second workspace backend.
    - path: "packages/brand/**"
      instructions: |
        Preserve the drop-lobe mark, warm paper, and graphite. Flag identity
        drift or duplicated brand constants.
    - path: "docs/**"
      instructions: |
        Treat docs outside the Rust engine evidence directory as current.
        Flag old paths, removed services, historical plans presented as current,
        and terms that disagree with the product or code.
    - path: "**/*.test.ts"
      instructions: |
        Tests must exercise the boundary that owns the behavior. Flag removed
        isolation or durability coverage, true-by-construction fakes, and
        timing-only assertions.
    - path: "apps/desktop/e2e/**"
      instructions: |
        Keep workflows deterministic. Use the real engine daemon for behavior
        that depends on persistence, sync, or restart recovery.
    - path: "package.json"
      instructions: |
        Check pnpm workspace boundaries, Node compatibility, script accuracy,
        and dependency placement.
    - path: "pnpm-lock.yaml"
      instructions: |
        Review only against manifest changes, unexpected package churn, and
        supply-chain risk.
    - path: "docker-compose*.yml"
      instructions: |
        Keep only the documented services. Flag checked-in secrets, unsafe
        public bindings, missing readiness conditions, and stale dependencies.

  pre_merge_checks:
    override_requested_reviewers_only: true
    title:
      mode: "warning"
      requirements: "Use a concise title that names the subsystem when useful."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - mode: "error"
        name: "Authorization boundaries"
        instructions: |
          Pass if the change preserves server-side identity, workspace scoping,
          path containment, share filters, and secret handling. Require focused
          tests when the PR touches one of these boundaries.
      - mode: "error"
        name: "Document durability"
        instructions: |
          Pass if editor and engine changes keep live Y.Doc state canonical,
          settle through the engine, report failures, and recover safely after
          daemon or renderer interruption.
      - mode: "error"
        name: "Brand identity"
        instructions: |
          Pass only if shipping source preserves the drop-lobe mark, warm
          paper, graphite, and the repository brand guard.
      - mode: "warning"
        name: "Verification"
        instructions: |
          Pass when the PR reports checks that match its risk. Engine changes
          need the canonical Rust gate. JavaScript changes need typecheck and
          test coverage unless the PR gives a specific reason.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 8
    ignore_title_keywords:
      - "wip"
      - "draft"
      - "no-review"
      - "skip review"
    drafts: false
    base_branches:
      - ".*"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    custom:
      - enabled: true
        name: "add focused regression tests"
        instructions: |
          Add the narrowest useful regression test for changed behavior. Use
          Playwright only when a lower-level test cannot cover the workflow.
      - enabled: true
        name: "check dohc invariants"
        instructions: |
          Read AGENTS.md. Identify any
          changed code that weakens an invariant and propose a focused fix.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 600000
    oxc:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: true
    hadolint:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    trivy:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    presidio:
      enabled: true

chat:
  auto_reply: true
  art: false
  allow_non_org_members: false
  integrations:
    jira:
      usage: "disabled"
    linear:
      usage: "disabled"

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  jira:
    usage: "disabled"
  linear:
    usage: "disabled"
  mcp:
    usage: "auto"

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "crates/**"
        instructions: "Document public contracts and non-obvious safety invariants. Do not restate the implementation."
      - path: "apps/desktop/src/**"
        instructions: "Prefer clear names. Comment only on non-obvious lifecycle, trust-boundary, or race behavior."
  unit_tests:
    path_instructions:
      - path: "crates/**"
        instructions: "Test transaction, cancellation, replay, and refusal behavior at the owning crate."
      - path: "apps/desktop/src/**"
        instructions: "Use Vitest for logic and components. Use Playwright only for full desktop workflows."

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: false
