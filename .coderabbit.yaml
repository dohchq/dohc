# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Be concise, direct, and product-minded. Prioritize correctness, authz/privacy, data durability, tests, and obvious UX over style nits. Keep comments actionable."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Summarize the user-facing outcome first, then call out changed subsystems,
    risk areas, and the verification evidence visible in the PR.
  auto_title_instructions: |
    Use a short imperative title that names the touched subsystem when useful.
    Use lowercase "dohc" only when the product name is needed.
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/.output/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/*.tsbuildinfo"
    - "!apps/web/src/routeTree.gen.ts"

  labeling_instructions:
    - label: "security"
      instructions: "Auth, authorization, sharing, workspace isolation, locks, skill-turn gates, secret handling, sandboxing, or dependency security."
    - label: "backend"
      instructions: "workspace-api routes, Better Auth, workspace-postgres schema/repositories, sync protocol, or API contract changes."
    - label: "editor"
      instructions: "Tiptap, Yjs, markdown import/export, inline atoms, formulas, editor readiness, collaboration, or persistence projection."
    - label: "frontend"
      instructions: "React, TanStack Start, routing, UI components, styles, app shell, or client-side interaction behavior."
    - label: "collab"
      instructions: "Hocuspocus, Yjs sync, awareness, collab auth, document naming, snapshots, sequences, or live provider changes."
    - label: "brand"
      instructions: "Brand package, logos, tokens, social assets, design system, or legacy product identity guard changes."
    - label: "docs"
      instructions: "Product, development, security, QA, or architecture documentation."
    - label: "tests"
      instructions: "Vitest, Playwright, fixtures, test helpers, or coverage-only changes."
    - label: "dependencies"
      instructions: "package.json, pnpm-lock.yaml, engines, workspace package boundaries, or dependency version changes."
    - label: "infra"
      instructions: "Docker, compose, environment examples, scripts, CI, deployment, or service runtime configuration."

  path_instructions:
    - path: "**/*"
      instructions: |
        Review dohc as a pre-launch AI-native text workspace. Favor high-signal
        comments about correctness, authz/privacy, data durability, review
        gates, obvious UX, and maintainability. Avoid style-only comments unless
        they affect readability or product quality. Treat AGENTS.md as product
        context: text is the primitive, user control matters, and durable,
        inspectable workspace state is more important than hidden convenience.
    - path: "services/workspace-api/**"
      instructions: |
        These routes are raw server endpoints. Review against
        docs/security/authz-boundaries.md. Flag client-callable code that
        accepts userId or other caller identity as authorization input, skips
        Better Auth session validation, omits workspace scoping, bypasses
        share boundaries, or weakens revision guards. Prefer fail-closed
        behavior and focused live-pg test coverage.
    - path: "services/hocuspocus/**"
      instructions: |
        Treat this service as the collaboration authority. Check signed
        actor/user tokens, document-name parsing, workspace ownership, the
        Postgres ACL, and snapshot/update sequencing. Flag any path that lets
        a caller choose identity or workspace without server verification.
    - path: "apps/desktop/**"
      instructions: |
        The desktop app is the primary client. Review Electron security
        (sandboxed renderer, typed preload bridge as the only seam, validated
        IPC), workspace path containment, and local-first behavior (no cloud
        requirement for local work).
    - path: "apps/web/src/**"
      instructions: |
        Review React/TanStack Start code for clear state ownership, accessible
        keyboard and focus behavior, stable routing, and no client-side trust
        boundary mistakes. Browser state may improve UX but must not become an
        authorization source.
    - path: "packages/brand/**"
      instructions: |
        Brand identity is final: lowercase dohc, drop-lobe mark, warm paper and
        graphite. Flag legacy product identity, palette drift, or duplicated
        brand constants outside the package.
    - path: "apps/web/src/__tests__/brandNoLegacy.test.ts"
      instructions: |
        Treat this as a shipping identity guard. Flag broad whitelists, deleted
        scan paths, or changes that would let legacy product names ship.
    - path: "docs/**"
      instructions: |
        Docs should preserve dohc's AI-native workspace philosophy and product
        invariants while staying concrete. Flag docs that contradict server-side
        authz, workspace scoping, Y.Doc canonical state, sandboxed HTML atoms,
        or individual-first MVP direction.
    - path: "**/*.test.ts"
      instructions: |
        Tests should lock behavior, not implementation trivia. Flag removed or
        weakened authz/security/brand/editor invariants, missing regression
        coverage for changed behavior, or tests that pass by over-mocking the
        boundary under review.
    - path: "apps/desktop/e2e/**"
      instructions: |
        Playwright coverage should represent real user workflows with stable
        selectors and deterministic setup. Avoid brittle timing-only waits.
    - path: "package.json"
      instructions: |
        Check pnpm workspace boundaries, Node/pnpm engine compatibility, script
        consistency, duplicate dependencies, and dependency moves between app,
        service, package, and root scopes.
    - path: "pnpm-lock.yaml"
      instructions: |
        Review lockfile changes only in relation to package manifest changes,
        supply-chain risk, and unexpected transitive dependency churn.
    - path: "**/Dockerfile"
      instructions: |
        Check runtime image size, non-secret build args, production install
        scope, lockfile consistency, and whether build/runtime stages expose
        unnecessary files or environment variables.
    - path: "docker-compose*.yml"
      instructions: |
        Treat compose files as local-dev infrastructure. Flag checked-in
        secrets, insecure defaults that could be mistaken for production, port
        conflicts, and health checks that do not reflect service readiness.

  pre_merge_checks:
    override_requested_reviewers_only: true
    title:
      mode: "warning"
      requirements: "Title should be concise, imperative, and name the subsystem when that helps review."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - mode: "error"
        name: "Authz Boundaries"
        instructions: |
          Pass if the PR does not touch auth, sharing, atoms, workspaces,
          locks, the Hocuspocus ACL, or server routes. Otherwise pass only if
          identity is derived server-side, every object remains workspace-scoped,
          browser/client callers cannot provide authorization identity, sharing
          boundaries are preserved, locks and skill gates still fail closed, and
          focused tests cover the changed boundary.
      - mode: "error"
        name: "Canonical Document State"
        instructions: |
          Pass if the PR does not touch editor, markdown, collaboration,
          import/export, persistence, projections, or atom body cache behavior.
          Otherwise pass only if the Y.Doc remains canonical, atoms.body is only
          a derived markdown cache, raw full-body markdown patching is not added
          as a source of truth, and migration/recovery paths are tested.
      - mode: "error"
        name: "Brand Identity"
        instructions: |
          Pass only if shipping source preserves lowercase dohc, the drop-lobe
          mark direction, warm paper plus graphite identity, and the legacy
          product identity guard. Any intentional exception must be explicitly
          justified in the PR and covered by tests or docs.
      - mode: "warning"
        name: "Verification"
        instructions: |
          Pass when the PR includes tests or a clear no-test rationale that fits
          the risk. Authz, editor/collab, sanitizer, persistence, dependency,
          and brand-guard changes should normally include focused automated
          verification.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 8
    ignore_title_keywords:
      - "wip"
      - "draft"
      - "no-review"
      - "skip review"
    drafts: false
    base_branches:
      - ".*"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    custom:
      - enabled: true
        name: "add focused regression tests"
        instructions: |
          Add or update the narrowest useful regression tests for the changed
          behavior. Prefer Vitest for unit and boundary coverage, and
          Playwright only for user-visible flows.
      - enabled: true
        name: "check dohc invariants"
        instructions: |
          Re-read AGENTS.md, apps/web/AGENTS.md, docs/security/authz-boundaries.md,
          and docs/development/testing.md, then identify any changed code that
          violates dohc's product invariants. Propose fixes rather than broad
          refactors.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 600000
    oxc:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: true
    hadolint:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    trivy:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    presidio:
      enabled: true

chat:
  auto_reply: true
  art: false
  allow_non_org_members: false
  integrations:
    jira:
      usage: "disabled"
    linear:
      usage: "disabled"

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "apps/web/AGENTS.md"
      - "docs/security/authz-boundaries.md"
      - "docs/development/testing.md"
      - "docs/product/*.md"
      - "docs/brand/design-system.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  jira:
    usage: "disabled"
  linear:
    usage: "disabled"
  mcp:
    usage: "auto"

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "services/workspace-api/**"
        instructions: "Generate docstrings only for exported functions or non-obvious server-side authorization boundaries. Do not restate route boilerplate."
      - path: "services/hocuspocus/**"
        instructions: "Document token, ACL, persistence, and sequence invariants where future agents could accidentally weaken them."
      - path: "apps/web/src/**"
        instructions: "Prefer clear names over comments. Add comments only for non-obvious editor, auth, routing, or sanitizer behavior."
  unit_tests:
    path_instructions:
      - path: "services/workspace-api/**"
        instructions: "Use live-pg Vitest coverage for workspace scoping, access denial, sharing, and revision guards."
      - path: "apps/web/src/**"
        instructions: "Use Vitest for pure logic and component behavior. Add Playwright only for full user workflows that unit tests cannot cover."
      - path: "services/hocuspocus/**"
        instructions: "Use Vitest for token parsing, ACL bridge behavior, document-name parsing, persistence sequencing, and reconnect/recovery cases."

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: false
